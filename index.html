<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overtone</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0a0014;
      --surface: #1a0a2e;
      --primary: #9b59b6;
      --gold: #d4af37;
      --text: #e0d8f0;
      --text-dim: #a090b0;
      --border: #2a1a3e;
      --slider-track: #2a1a3e;
      --slider-thumb: #d4af37;
      --cell-off: #111;
      --cell-on: #d4af37;
      --white-key: #f5f0e8;
      --black-key: #2a1a3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      height: 100vh;
      user-select: none;
    }
    #root {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #af6fcf; }
    button.secondary {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    button.gold {
      background: var(--gold);
      color: #0a0014;
      font-weight: bold;
    }
    button.danger {
      background: #5a1a1a;
      border: 1px solid #8a2a2a;
    }
    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      background: transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: var(--slider-track);
      border-radius: 3px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--slider-thumb);
      cursor: pointer;
      margin-top: -5px;
    }
    input[type="number"], select, input[type="text"] {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem;
      font-size: 0.9rem;
    }
    canvas {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .app-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
      overflow-y: auto;
    }
    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .sidebar h2 {
      color: var(--gold);
      font-size: 1.2rem;
      margin: 0;
    }
    .sound-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sound-item:hover { background: #2a1a3e; }
    .sound-item.selected { background: #2a1a3e; color: var(--gold); }
    .sound-item button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
    }
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .transport-bar {
      height: 50px;
      min-height: 50px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 1rem;
    }
    .step-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .step-dot {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      background: var(--border);
    }
    .step-dot.active {
      background: var(--gold);
    }
    .sequencer-container {
      flex: 1;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sequencer-toolbar {
      padding: 0.5rem 1rem;
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .sequencer-tracks {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
    }
    .track {
      display: flex;
      align-items: center;
      height: 40px;
      width: max-content;
      min-width: 100%;
      border-bottom: 1px solid #1a1a2e;
    }
    .track-label {
      width: 140px;
      flex-shrink: 0;
      padding: 0 1rem;
      font-size: 0.85rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      height: 100%;
      border-right: 1px solid var(--border);
    }
    .track-label button {
      font-size: 0.7rem;
      padding: 0.2rem 0.4rem;
      margin-left: auto;
    }
    .track-timeline {
      flex: 1;
      flex-shrink: 0;
      height: 100%;
      position: relative;
      background: var(--bg);
    }
    .clip {
      position: absolute;
      height: 100%;
      background: var(--primary);
      border: 1px solid var(--gold);
      border-radius: 3px;
      cursor: grab;
      display: flex;
      align-items: center;
      padding: 0 0.5rem;
      font-size: 0.75rem;
      overflow: hidden;
      white-space: nowrap;
      opacity: 0.8;
      z-index: 1;
    }
    .clip:active { cursor: grabbing; }
    .clip.selected {
      opacity: 1;
      border-width: 2px;
      background: #7b3fa0;
    }
    .clip.dragging {
      opacity: 0.5;
      z-index: 10;
      pointer-events: none;
    }
    .clip-preview {
      position: absolute;
      height: 100%;
      background: rgba(212, 175, 55, 0.3);
      border: 2px dashed var(--gold);
      border-radius: 3px;
      pointer-events: none;
      z-index: 5;
    }
    .sequencer-step-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--gold);
      pointer-events: none;
      z-index: 3;
    }
    .piano-roll-container {
      flex: 0 0 auto;
      height: 360px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .piano-roll-toolbar {
      padding: 0.5rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .piano-roll-grid-wrapper {
      flex: 1;
      overflow: auto;
      display: flex;
      position: relative;
    }
    .piano-roll-resize-handle {
      position: absolute;
      right: -3px;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: ew-resize;
      background: rgba(212, 175, 55, 0.1);
      z-index: 10;
      transition: background 0.2s;
    }
    .piano-roll-resize-handle:hover {
      background: rgba(212, 175, 55, 0.4);
    }
    .piano-labels {
      width: 70px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .piano-labels canvas {
      border: none;
      border-radius: 0;
    }
    .grid-scroll {
      flex: 1;
      overflow: visible;
      position: relative;
    }
    .grid-wrapper {
      position: relative;
      width: fit-content;
    }
    .grid {
      display: grid;
      grid-template-rows: repeat(36, 20px);
      width: fit-content;
      background: var(--cell-off);
      position: relative;
    }
    .cell {
      border: 1px solid #1a1a2e;
      transition: background 0.1s;
    }

    .subdivision-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .sub-line {
      position: absolute;
      top: 0;
      height: 100%;
      width: 1px;
      background: var(--border);
    }
    .sub-line.thin {
      opacity: 0.3;
    }
    .note-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .note-block {
      position: absolute;
      background: #b8860b;
      border: 1px solid #daa520;
      border-radius: 2px;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.1s;
    }
    .note-block:hover {
      background: #daa520;
    }
    .note-block .resize-handle {
      position: absolute;
      right: 0;
      top: 0;
      width: 6px;
      height: 100%;
      cursor: ew-resize;
      background: rgba(255,255,255,0.1);
    }
    .note-block .resize-handle:hover {
      background: rgba(255,255,255,0.3);
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal-wrapper {
      display: flex;
      align-items: stretch;
      transition: all 0.3s ease;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      position: relative;
    }
    .modal h3 { margin: 0; color: var(--gold); }
    .panel-toggle {
      width: 20px;
      flex-shrink: 0;
      align-self: center;
      height: 48px;
      background: var(--primary);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      z-index: 2;
      transition: background 0.2s;
    }
    .panel-toggle:hover { background: #af6fcf; }
    .panel-toggle.left {
      border-radius: 4px 0 0 4px;
    }
    .panel-toggle.right {
      border-radius: 0 4px 4px 0;
    }
    .effects-toggle {
      width: 20px;
      flex-shrink: 0;
      align-self: center;
      height: 48px;
      background: var(--primary);
      border: 1px solid var(--border);
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      z-index: 2;
      transition: background 0.2s;
    }
    .effects-toggle:hover { background: #af6fcf; }
    .effects-panel {
      background: var(--surface);
      border: none;
      border-radius: 0 8px 8px 0;
      width: 0;
      overflow: hidden;
      transition: width 0.3s ease, padding 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .effects-panel.open {
      border: 1px solid var(--border);
      border-left: none;
      width: 380px;
      padding: 1.5rem;
      overflow-y: auto;
    }
    .lfo-panel {
      background: var(--surface);
      border: none;
      border-radius: 0;
      width: 0;
      overflow: hidden;
      transition: width 0.3s ease, padding 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .lfo-panel.open {
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 8px 0 0 8px;
      width: 280px;
      padding: 1.5rem;
      overflow-y: auto;
    }
    .effect-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .effect-row label {
      font-size: 0.85rem;
      color: var(--text-dim);
      min-width: 70px;
    }
    .effect-row input[type="range"] {
      flex: 1;
    }
    .effect-row input[type="number"] {
      width: 65px;
    }
    .synth-grid {
      display: grid;
      grid-template-columns: 120px 1fr 80px;
      align-items: center;
      gap: 0.5rem 1rem;
    }
    .synth-grid label { font-size: 0.9rem; color: var(--text-dim); }
    .waveform-preview { display: flex; justify-content: center; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--slider-thumb); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, useMemo, createContext, useContext } = React;

    // ---------- Constants ----------
    const PITCHES = ['C3','C#3','D3','D#3','E3','F3','F#3','G3','G#3','A3','A#3','B3','C4','C#4','D4','D#4','E4','F4','F#4','G4','G#4','A4','A#4','B4','C5','C#5','D5','D#5','E5','F5','F#5','G5','G#5','A5','A#5','B5'];
    const PITCH_ROOTS = new Set(['C3','D3','E3','F3','G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5']);
    const SHARPS = new Set(['C#3','D#3','F#3','G#3','A#3','C#4','D#4','F#4','G#4','A#4','C#5','D#5','F#5','G#5','A#5']);
    const STEPS = 16;
    const SUBDIVISIONS = 4;          // 64th notes per 16th-note cell
    const TOTAL_TICKS = STEPS * SUBDIVISIONS;
    const TICK_WIDTH = 10;           // pixels per 64th-note tick
    const CELL_WIDTH = TICK_WIDTH * SUBDIVISIONS; // 40px per grid cell
    const STEP_WIDTH = 20;
    const freqFromPitch = (p) => 440 * Math.pow(2, (PITCHES.indexOf(p) - PITCHES.indexOf('A4')) / 12);

    // ---------- Audio Engine ----------
    class AudioEngine {
      constructor() { this.ctx = null; this.masterGain = null; }
      getContext() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.8;
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      setMasterVolume(value) {
        if (this.masterGain) this.masterGain.gain.value = value / 100;
      }
    }

    // ---------- Synth Voice Pool ----------
    class SynthVoicePool {
      constructor(ctx, engine, config, size = 8) {
        this.ctx = ctx;
        this.engine = engine;
        this.config = config;
        this.size = size;
        this.voices = [];
        this.nextIndex = 0;
        for (let i = 0; i < size; i++) {
          this.voices.push(new SynthVoice(ctx, config, false)); // owned by pool
          this.voices[i].engine = engine;
        }
      }

      getVoice() {
        // Look for an idle voice first
        for (const v of this.voices) {
          if (!v.active) return v;
        }
        // Steal the oldest active voice
        const oldest = this.voices[this.nextIndex];
        oldest.release();
        this.nextIndex = (this.nextIndex + 1) % this.size;
        return oldest;
      }

      updateConfig(config) {
        this.config = config;
        for (const v of this.voices) {
          if (!v.active) v.config = config;
        }
      }

      releaseAll() {
        for (const v of this.voices) {
          v.release();
        }
      }
    }

    // ---------- Sample Voice (for imported audio clips) ----------
    class SampleVoice {
      constructor(ctx) {
        this.ctx = ctx;
        this.active = false;
        this.source = null;
      }
      play(buffer, freq, startTime, duration) {
        if (this.active) this.release();
        this.active = true;
        const source = this.ctx.createBufferSource();
        source.buffer = buffer;
        // Calculate playbackRate to shift pitch: relative to original pitch (assume original maps to A4 = 440Hz)
        // We'll assume the original sample is at A4 (440Hz), and target freq given.
        source.playbackRate.value = freq / 440;
        const now = startTime;
        source.start(now, 0, Math.min(duration, buffer.duration));
        source.onended = () => { this.active = false; };
        // Connect to a gain node for simple volume (optional)
        const gainNode = this.ctx.createGain();
        gainNode.gain.value = 0.8;
        source.connect(gainNode);
        gainNode.connect(this.engine?.masterGain || this.ctx.destination);
        this.source = source;
        this.gainNode = gainNode;
      }
      release() {
        if (!this.active) return;
        try { this.source.stop(); } catch(e) {}
        this.source.disconnect();
        this.gainNode.disconnect();
        this.active = false;
      }
    }

    class SampleVoicePool {
      constructor(ctx, engine, buffer, size = 4) {
        this.ctx = ctx;
        this.engine = engine;
        this.buffer = buffer;
        this.voices = [];
        this.nextIndex = 0;
        for (let i = 0; i < size; i++) {
          const v = new SampleVoice(ctx);
          v.engine = engine;
          this.voices.push(v);
        }
      }
      getVoice() {
        for (const v of this.voices) if (!v.active) return v;
        const oldest = this.voices[this.nextIndex];
        oldest.release();
        this.nextIndex = (this.nextIndex + 1) % this.voices.length;
        return oldest;
      }
      releaseAll() { for (const v of this.voices) v.release(); }
    }

    // ---------- Synth Voice ----------
    class SynthVoice {
      constructor(ctx, config, autoConnect = true) {
        this.ctx = ctx;
        this.config = config;
        this.active = false;
        this.autoConnect = autoConnect;
        this._releaseCallbacks = [];
      }
      play(freq, startTime, duration) {
        if (this.active) this.release();
        this.active = true;
        const { type='sine', filterType='lowpass', cutoff=1000, resonance=0, attack=0.01, decay=0.1, sustain=0.6, release=0.3, gain=0.3, effects={} } = this.config;
        const now = startTime;
        const susStart = now + attack + decay;
        const noteOff = now + duration;

        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const envGain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        filter.type = filterType;
        filter.frequency.value = cutoff;
        filter.Q.value = resonance;
        envGain.gain.setValueAtTime(0, now);
        envGain.gain.linearRampToValueAtTime(gain, now + attack);
        envGain.gain.linearRampToValueAtTime(sustain * gain, susStart);
        envGain.gain.setValueAtTime(sustain * gain, noteOff);
        envGain.gain.linearRampToValueAtTime(0, noteOff + release);

        // connect osc -> filter -> envGain
        osc.connect(filter);
        filter.connect(envGain);
        let lastNode = envGain;

        // Delay effect
        if (effects.delayEnabled) {
          const dryGain = this.ctx.createGain();
          const wetGain = this.ctx.createGain();
          const delay = this.ctx.createDelay(1.0);
          const feedback = this.ctx.createGain();
          delay.delayTime.value = effects.delayTime || 0.3;
          feedback.gain.value = effects.delayFeedback || 0.4;
          dryGain.gain.value = 1 - (effects.delayWet || 0.5);
          wetGain.gain.value = effects.delayWet || 0.5;

          lastNode.connect(dryGain);
          lastNode.connect(wetGain);
          wetGain.connect(delay);
          delay.connect(feedback);
          feedback.connect(delay);
          lastNode = dryGain;
          delay.connect(dryGain);
        }

        // Distortion effect
        if (effects.distortionEnabled) {
          const distGain = this.ctx.createGain();
          const shaper = this.ctx.createWaveShaper();
          const amount = (effects.distortionAmount || 50) / 100;
          const curveType = effects.distortionCurve || 'soft';
          const n = 44100;
          const curve = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            const x = i * 2 / n - 1;
            if (curveType === 'soft') {
              curve[i] = (3 + amount * 20) * x * 20 * (Math.PI / 180) / (Math.PI + amount * Math.abs(x));
            } else if (curveType === 'hard') {
              const drive = 1 + amount * 10;
              curve[i] = Math.max(-1, Math.min(1, x * drive));
            } else if (curveType === 'foldback') {
              const threshold = 1 - amount * 0.8;
              curve[i] = Math.abs(x) < threshold ? x : (1 - Math.abs(x)) / (1 - threshold) * (x > 0 ? 1 : -1);
            }
          }
          shaper.curve = curve;
          lastNode.connect(shaper);
          shaper.connect(distGain);
          distGain.gain.value = 1;
          lastNode = distGain;
        }

        // Bitcrusher effect
        if (effects.bitcrusherEnabled) {
          const bits = effects.bitDepth || 8;
          const rate = effects.sampleRate || 8000;
          const step = Math.pow(0.5, bits);
          const crusher = this.ctx.createScriptProcessor(256, 1, 1);
          crusher.onaudioprocess = (e) => {
            const input = e.inputBuffer.getChannelData(0);
            const output = e.outputBuffer.getChannelData(0);
            for (let i = 0; i < input.length; i++) {
              output[i] = Math.round(input[i] / step) * step;
            }
          };
          // sample rate reduction using a simple down/up-sampling approach is complex;
          // we omit actual rate reduction for now and keep it as a placeholder
          lastNode.connect(crusher);
          crusher.connect(this.ctx.destination);
          lastNode = crusher;
        }

        // Reverb effect (simple feedback delay with filter)
        if (effects.reverbEnabled) {
          const dryGain = this.ctx.createGain();
          const wetGain = this.ctx.createGain();
          const reverbDelay = this.ctx.createDelay(0.1);
          const feedback = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          reverbDelay.delayTime.value = 0.05;
          feedback.gain.value = Math.min(effects.reverbDecay || 0.5, 0.85); // prevent self-oscillation
          filter.type = 'lowpass';
          filter.frequency.value = 3000;
          dryGain.gain.value = 1 - (effects.reverbMix || 0.5);
          wetGain.gain.value = effects.reverbMix || 0.5;

          lastNode.connect(dryGain);
          lastNode.connect(wetGain);
          wetGain.connect(reverbDelay);
          reverbDelay.connect(filter);
          filter.connect(feedback);
          feedback.connect(reverbDelay);
          lastNode = dryGain;
          reverbDelay.connect(dryGain);
        }

        // Safety limiter (shared across all voices)
        if (!this._poolLimiter) {
          this._poolLimiter = this.ctx.createDynamicsCompressor();
          this._poolLimiter.threshold.value = -6;
          this._poolLimiter.knee.value = 0;
          this._poolLimiter.ratio.value = 20;
          this._poolLimiter.attack.value = 0.003;
          this._poolLimiter.release.value = 0.25;
          this._poolLimiter.connect((this.engine && this.engine.masterGain) || this.ctx.destination);
        }
        const limiter = this._poolLimiter;

        // LFO modulation
        if (this.config.lfo?.enabled) {
          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();
          const lfoDepth = this.config.lfo.depth || 0.5;
          lfo.type = this.config.lfo.waveform || 'sine';
          lfo.frequency.value = this.config.lfo.rate || 2;
          lfoGain.gain.value = 0;

          const target = this.config.lfo.target || 'filter';
          if (target === 'filter') {
            const baseCutoff = filter.frequency.value;
            lfoGain.gain.value = lfoDepth * baseCutoff * 0.5;
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
          } else if (target === 'pitch') {
            const baseFreq = freq;
            lfoGain.gain.value = lfoDepth * baseFreq * 0.1;
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
          } else if (target === 'gain') {
            const tremoloGain = this.ctx.createGain();
            tremoloGain.gain.value = 1;
            lfoGain.gain.value = lfoDepth * 0.3;
            lfo.connect(lfoGain);
            lfoGain.connect(tremoloGain.gain);
            envGain.disconnect();
            envGain.connect(tremoloGain);
            lastNode = tremoloGain;
          }
          lfo.start(now);
          lfo.stop(noteOff + release + 1.5);
          this._releaseCallbacks.push(() => {
            lfo.stop();
            lfo.disconnect();
          });
        }

        // Post filter (tone shaping)
        if (this.config.postFilterEnabled) {
          const postFilter = this.ctx.createBiquadFilter();
          postFilter.type = this.config.postFilterType || 'lowpass';
          postFilter.frequency.value = this.config.postFilterFreq || 2000;
          postFilter.Q.value = this.config.postFilterQ || 0;
          lastNode.connect(postFilter);
          lastNode = postFilter;
        }

        lastNode.connect(limiter);
        osc.start(now);
        osc.stop(noteOff + release + 1.5);

        // Store nodes for cleanup
        this._nodes = { osc, filter, envGain, delayNodes: [], distNodes: [], reverbNodes: [], lfoNodes: [] };
      }

      release() {
        if (!this.active) return;
        this.active = false;
        if (this._nodes) {
          const { osc, filter, envGain } = this._nodes;
          try { osc.stop(); } catch(e) {}
          osc.disconnect();
          filter.disconnect();
          envGain.disconnect();
          // Disconnect any effect nodes that were created
          for (const n of this._nodes.delayNodes) n.disconnect();
          for (const n of this._nodes.distNodes) n.disconnect();
          for (const n of this._nodes.reverbNodes) n.disconnect();
          for (const n of this._nodes.lfoNodes) n.disconnect();
          this._nodes = null;
        }
        // Run any additional release callbacks (LFOs, etc.)
        for (const cb of this._releaseCallbacks) {
          try { cb(); } catch(e) {}
        }
        this._releaseCallbacks = [];
      }
    }

    // ---------- Scheduler ----------
    class Scheduler {
      constructor(ctx) { this.ctx = ctx; this.timer = null; this.step = 0; this.nextTime = 0; this.cb = null; this.bpm = 120; this.steps = 16; }
      start(bpm, steps, onStep) {
        const stepDur = 60 / bpm / 4;
        this.bpm = bpm;
        this.steps = steps;
        this.step = 0;
        this.nextTime = this.ctx.currentTime;
        this.cb = onStep;
        this.timer = setInterval(() => {
          while (this.nextTime < this.ctx.currentTime + 0.1) {
            this.cb(this.step, this.nextTime);
            this.step = (this.step + 1) % steps;
            this.nextTime += stepDur;
          }
        }, 25);
      }
      stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }
      reset() {
        this.step = 0;
        this.nextTime = this.ctx.currentTime + 0.05; // short offset to retrigger immediately
      }
    }

    // ---------- Waveform Drawing ----------
    function drawWaveform(canvas, type) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle='#d4af37'; ctx.lineWidth=2;
      ctx.beginPath();
      const samples=200;
      for(let i=0;i<=samples;i++){
        const x=(i/samples)*w;
        let t=i/samples, y=h/2;
        if(type==='sine') y=h/2-Math.sin(t*Math.PI*2)*(h/2-2);
        else if(type==='square') y=t<0.5?2:h-2;
        else if(type==='sawtooth') y=h-2-(t*(h-4));
        else if(type==='triangle') y=t<0.5?(2+(t*2)*(h/2-2)):(h-2-((t-0.5)*2)*(h/2-2));
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    // ---------- Piano Keyboard Drawing ----------
    function drawPianoKeyboard(canvas, pitches, sharps) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const rowH = h / pitches.length;

      for (let i = 0; i < pitches.length; i++) {
        const p = pitches[i];
        const y = i * rowH;
        const isSharp = sharps.has(p);
        if (isSharp) {
          const inset = 8;
          ctx.fillStyle = '#1a1a2e';
          ctx.fillRect(inset, y, w - inset * 2, rowH);
          ctx.fillStyle = '#666';
          ctx.font = '7px monospace';
          ctx.fillText(p, inset + 2, y + rowH - 2);
        } else {
          ctx.fillStyle = '#f0ece4';
          ctx.fillRect(0, y, w, rowH);
          ctx.strokeStyle = '#ccc';
          ctx.strokeRect(0, y, w, rowH);
          ctx.fillStyle = '#333';
          ctx.font = 'bold 8px monospace';
          ctx.fillText(p, 4, y + rowH - 4);
        }
      }
    }

    // ---------- Contexts ----------
    const EngineContext = createContext(null);
    const SoundLibraryContext = createContext({ sounds:[], addSound:()=>{}, updateSound:()=>{} });

    // ---------- Sound Creation/Edit Modal ----------
    function SoundModal({ initialSound, onClose }) {
      const engine = useContext(EngineContext);
      const { addSound, updateSound } = useContext(SoundLibraryContext);
      const editing = !!initialSound;
      const [name, setName] = useState(initialSound?.name || 'New Sound');
      const [config, setConfig] = useState(initialSound?.config || {
        type:'sine', filterType:'lowpass', cutoff:1000, resonance:0,
        attack:0.01, decay:0.1, sustain:0.6, release:0.3, gain:0.3,
        postFilterEnabled: false, postFilterType:'lowpass', postFilterFreq:2000, postFilterQ:0,
        lfo: {
          enabled: false, waveform:'sine', rate:2, depth:0.5,
          target:'filter', // 'filter','pitch','gain'
        },
        effects: {
          delayEnabled: false, delayTime: 0.3, delayFeedback: 0.4, delayWet: 0.5,
          reverbEnabled: false, reverbDecay: 0.5, reverbMix: 0.5,
          distortionEnabled: false, distortionAmount: 50, distortionCurve: 'soft',
          bitcrusherEnabled: false, bitDepth: 8, sampleRate: 8000,
        }
      });
      const [showEffects, setShowEffects] = useState(false);
      const waveCanvasRef = useRef(null);
      const spectrumCanvasRef = useRef(null);
      const envCanvasRef = useRef(null);
      const [vizMode, setVizMode] = useState('waveform'); // 'waveform' | 'spectrum' | 'envelope'

      // Draw waveform whenever oscillator type changes
      useEffect(() => {
        if (waveCanvasRef.current) drawWaveform(waveCanvasRef.current, config.type);
      }, [config.type]);

      // Draw frequency response whenever filter/post-filter parameters change
      useEffect(() => {
        if (spectrumCanvasRef.current) drawStaticSpectrum(spectrumCanvasRef.current, config);
      }, [
        config.type, config.filterType, config.cutoff, config.resonance,
        config.postFilterEnabled, config.postFilterType, config.postFilterFreq, config.postFilterQ
      ]);

      // Draw ADSR envelope whenever envelope parameters change
      useEffect(() => {
        if (envCanvasRef.current) drawEnvelope(envCanvasRef.current, config);
      }, [config.attack, config.decay, config.sustain, config.release]);

      const drawEnvelope = (canvas, cfg) => {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2;
        const attack = cfg.attack || 0.01;
        const decay = cfg.decay || 0.1;
        const sustain = cfg.sustain || 0.6;
        const release = cfg.release || 0.3;
        const totalDur = attack + decay + 0.3 + release;
        const scaleX = w / totalDur;
        const scaleY = h * 0.9;
        const offsetY = h * 0.05;
        const toX = (t) => t * scaleX;
        const toY = (v) => h - offsetY - v * scaleY;
        ctx.beginPath();
        ctx.moveTo(toX(0), toY(0));
        ctx.lineTo(toX(attack), toY(1));
        ctx.lineTo(toX(attack + decay), toY(sustain));
        ctx.lineTo(toX(attack + decay + 0.3), toY(sustain));
        ctx.lineTo(toX(totalDur), toY(0));
        ctx.stroke();
      };

      const drawStaticSpectrum = (canvas, cfg) => {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        const freqMin = 20, freqMax = 8000;
        const freqToX = (f) => Math.log(f / freqMin) / Math.log(freqMax / freqMin) * w;
        
        const getOscHarmonics = (type) => {
          const harmonics = [];
          for (let k = 1; k <= 10; k++) {
            let amp = 0;
            if (type === 'sine') amp = (k === 1 ? 1 : 0);
            else if (type === 'square') amp = (k % 2 === 1 ? 1/k : 0);
            else if (type === 'sawtooth') amp = 1/k;
            else if (type === 'triangle') amp = (k % 2 === 1 ? 1/(k*k) : 0);
            harmonics.push(amp);
          }
          return harmonics;
        };

        const harmonics = getOscHarmonics(cfg.type);
        const fundamental = 440;

        const filterMag = (freq) => {
          const mag1 = biquadMag(cfg.filterType, cfg.cutoff, cfg.resonance, freq);
          if (cfg.postFilterEnabled) {
            const mag2 = biquadMag(cfg.postFilterType, cfg.postFilterFreq, cfg.postFilterQ, freq);
            return mag1 * mag2;
          }
          return mag1;
        };

        const biquadMag = (type, freq, q, f) => {
          const w = f / freq;
          const w2 = w * w;
          const Q = Math.max(0.01, q);
          switch (type) {
            case 'lowpass': return 1 / Math.sqrt(w2 * w2 + (1/Q - 2) * w2 + 1);
            case 'highpass': return w2 / Math.sqrt(w2 * w2 + (1/Q - 2) * w2 + 1);
            case 'bandpass': return (w/Q) / Math.sqrt(w2 * w2 + (1/Q - 2) * w2 + 1);
            case 'notch': return Math.abs(1 - w2) / Math.sqrt(w2 * w2 + (1/Q - 2) * w2 + 1);
            default: return 1;
          }
        };

        // Draw harmonic stems
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2;
        for (let k = 1; k <= 10; k++) {
          const amp = harmonics[k-1];
          if (amp === 0) continue;
          const freq = fundamental * k;
          const x = freqToX(freq);
          if (x < 0 || x > w) continue;
          const mag = filterMag(freq);
          const stemHeight = amp * mag * h * 0.9;
          ctx.beginPath();
          ctx.moveTo(x, h);
          ctx.lineTo(x, h - stemHeight);
          ctx.stroke();
        }

        // Draw main filter response curve (always visible)
        ctx.strokeStyle = 'rgba(155, 89, 182, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        const steps = 200;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const freq = freqMin * Math.pow(freqMax / freqMin, t);
          const x = t * w;
          const mag1 = biquadMag(cfg.filterType, cfg.cutoff, cfg.resonance, freq);
          const y = h - mag1 * h * 0.9;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // If post-filter is enabled, draw its individual curve in bright red
        if (cfg.postFilterEnabled) {
          ctx.strokeStyle = 'rgba(231, 76, 60, 0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const freq = freqMin * Math.pow(freqMax / freqMin, t);
            const x = t * w;
            const mag2 = biquadMag(cfg.postFilterType, cfg.postFilterFreq, cfg.postFilterQ, freq);
            const y = h - mag2 * h * 0.9;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
      };

      const update = (k,v) => setConfig(prev=>({...prev,[k]:v}));
      const updateEffect = (k,v) => setConfig(prev=>({...prev, effects:{...prev.effects, [k]:v}}));
      const updateLFO = (k,v) => setConfig(prev=>({...prev, lfo:{...prev.lfo, [k]:v}}));
      const handlePreview = () => { const ctx=engine.getContext(); new SynthVoice(ctx,config).play(440,ctx.currentTime,0.5); };
      const handleSave = () => {
        if(editing) updateSound(initialSound.id, { name:name||'Unnamed', config });
        else addSound({ name:name||'Unnamed', config });
        onClose();
      };
      const [showLFO, setShowLFO] = useState(false);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-wrapper" onClick={e=>e.stopPropagation()}>
          <div className={`lfo-panel ${showLFO ? 'open' : ''}`}>
            {showLFO && (
              <>
                <h3 style={{color:'var(--gold)', margin:0}}>LFO</h3>
                <div className="effect-row">
                  <input type="checkbox" checked={config.lfo?.enabled||false} onChange={e=>updateLFO('enabled',e.target.checked)} />
                  <label>Enable</label>
                </div>
                <div className="effect-row">
                  <label>Wave</label>
                  <select value={config.lfo?.waveform||'sine'} onChange={e=>updateLFO('waveform',e.target.value)} style={{width:'80px'}}>
                    <option value="sine">Sine</option>
                    <option value="triangle">Triangle</option>
                    <option value="square">Square</option>
                    <option value="sawtooth">Sawtooth</option>
                  </select>
                </div>
                <div className="effect-row">
                  <label>Rate</label>
                  <input type="range" min="0.1" max="20" step="0.1" value={config.lfo?.rate||2} onChange={e=>updateLFO('rate',+e.target.value)} />
                  <input type="number" value={config.lfo?.rate||2} step="0.1" onChange={e=>updateLFO('rate',+e.target.value)} />
                </div>
                <div className="effect-row">
                  <label>Depth</label>
                  <input type="range" min="0" max="1" step="0.01" value={config.lfo?.depth||0.5} onChange={e=>updateLFO('depth',+e.target.value)} />
                  <input type="number" value={config.lfo?.depth||0.5} step="0.01" onChange={e=>updateLFO('depth',+e.target.value)} />
                </div>
                <div className="effect-row">
                  <label>Target</label>
                  <select value={config.lfo?.target||'filter'} onChange={e=>updateLFO('target',e.target.value)} style={{width:'80px'}}>
                    <option value="filter">Filter</option>
                    <option value="pitch">Pitch</option>
                    <option value="gain">Gain</option>
                  </select>
                </div>
              </>
            )}
          </div>
          <button className="panel-toggle left" onClick={(e)=>{ e.stopPropagation(); setShowLFO(s=>!s); }} title="LFO">
            {showLFO ? '▶' : '◀'}
          </button>
          <div className="modal">
            <h3>{editing?'Edit Sound':'Create Sound'}</h3>
            <div className="synth-grid">
              <label>Name</label>
              <input type="text" value={name} onChange={e=>setName(e.target.value)} style={{gridColumn:'2/4', width:'100%'}} />
              <label>Osc Type</label>
              <select value={config.type} onChange={e=>update('type',e.target.value)}>
                <option value="sine">Sine</option><option value="square">Square</option><option value="sawtooth">Sawtooth</option><option value="triangle">Triangle</option>
              </select><div></div>
              <label>Filter</label>
              <select value={config.filterType} onChange={e=>update('filterType',e.target.value)}>
                <option value="lowpass">Lowpass</option><option value="highpass">Highpass</option><option value="bandpass">Bandpass</option><option value="notch">Notch</option>
              </select><div></div>
              <label>Cutoff</label>
              <input type="range" min="20" max="8000" step="1" value={config.cutoff} onChange={e=>update('cutoff',+e.target.value)} />
              <input type="number" value={config.cutoff} onChange={e=>update('cutoff',+e.target.value)} />
              <label>Resonance</label>
              <input type="range" min="0" max="20" step="0.1" value={config.resonance} onChange={e=>update('resonance',+e.target.value)} />
              <input type="number" value={config.resonance} onChange={e=>update('resonance',+e.target.value)} />
              <label>Attack</label>
              <input type="range" min="0" max="2" step="0.01" value={config.attack} onChange={e=>update('attack',+e.target.value)} />
              <input type="number" value={config.attack} step="0.01" onChange={e=>update('attack',+e.target.value)} />
              <label>Decay</label>
              <input type="range" min="0" max="2" step="0.01" value={config.decay} onChange={e=>update('decay',+e.target.value)} />
              <input type="number" value={config.decay} step="0.01" onChange={e=>update('decay',+e.target.value)} />
              <label>Sustain</label>
              <input type="range" min="0" max="1" step="0.01" value={config.sustain} onChange={e=>update('sustain',+e.target.value)} />
              <input type="number" value={config.sustain} step="0.01" onChange={e=>update('sustain',+e.target.value)} />
              <label>Release</label>
              <input type="range" min="0" max="2" step="0.01" value={config.release} onChange={e=>update('release',+e.target.value)} />
              <input type="number" value={config.release} step="0.01" onChange={e=>update('release',+e.target.value)} />
              <label>Gain</label>
              <input type="range" min="0" max="1" step="0.01" value={config.gain} onChange={e=>update('gain',+e.target.value)} />
              <input type="number" value={config.gain} step="0.01" onChange={e=>update('gain',+e.target.value)} />

              <label>Post Filter</label>
              <input type="checkbox" checked={config.postFilterEnabled||false} onChange={e=>update('postFilterEnabled',e.target.checked)} />
              <span style={{fontSize:'0.85rem', color:'var(--text-dim)'}}>On</span>

              <label>Type</label>
              <select value={config.postFilterType||'lowpass'} onChange={e=>update('postFilterType',e.target.value)}>
                <option value="lowpass">Lowpass</option>
                <option value="highpass">Highpass</option>
              </select>
              <div></div>

              <label>Freq</label>
              <input type="range" min="20" max="8000" step="1" value={config.postFilterFreq||2000} onChange={e=>update('postFilterFreq',+e.target.value)} />
              <input type="number" value={config.postFilterFreq||2000} onChange={e=>update('postFilterFreq',+e.target.value)} />

              <label>Q</label>
              <input type="range" min="0" max="20" step="0.1" value={config.postFilterQ||0} onChange={e=>update('postFilterQ',+e.target.value)} />
              <input type="number" value={config.postFilterQ||0} step="0.1" onChange={e=>update('postFilterQ',+e.target.value)} />
            </div>
            <div className="waveform-preview">
              <canvas ref={waveCanvasRef} width="300" height="100" style={{display: vizMode === 'waveform' ? 'block' : 'none'}} />
              <canvas ref={spectrumCanvasRef} width="300" height="100" style={{display: vizMode === 'spectrum' ? 'block' : 'none'}} />
              <canvas ref={envCanvasRef} width="300" height="100" style={{display: vizMode === 'envelope' ? 'block' : 'none'}} />
            </div>
            <div style={{display:'flex', gap:'1rem', justifyContent:'center', marginTop: '-0.5rem'}}>
              <button className={vizMode === 'waveform' ? 'gold' : 'secondary'} onClick={() => setVizMode('waveform')} style={{fontSize:'0.8rem', padding:'0.3rem 0.6rem'}}>Wave</button>
              <button className={vizMode === 'freq' ? 'gold' : 'secondary'} onClick={() => setVizMode('spectrum')} style={{fontSize:'0.8rem', padding:'0.3rem 0.6rem'}}>Freq</button>
              <button className={vizMode === 'envelope' ? 'gold' : 'secondary'} onClick={() => setVizMode('envelope')} style={{fontSize:'0.8rem', padding:'0.3rem 0.6rem'}}>Env</button>
            </div>
            <div style={{display:'flex', gap:'1rem', justifyContent:'flex-end'}}>
              <button className="secondary" onClick={handlePreview}>Preview (A4)</button>
              <button className="gold" onClick={handleSave}>{editing?'Save Changes':'Save Sound'}</button>
            </div>
          </div>
          <button className="effects-toggle" onClick={(e)=>{ e.stopPropagation(); setShowEffects(s=>!s); }} title="Effects">
            {showEffects ? '◀' : '▶'}
          </button>
          <div className={`effects-panel ${showEffects ? 'open' : ''}`}>
            {showEffects && (
              <>
                <h3 style={{color:'var(--gold)', margin:0}}>Effects</h3>

                <div className="effect-row">
                  <input type="checkbox" checked={config.effects?.delayEnabled||false} onChange={e=>updateEffect('delayEnabled',e.target.checked)} />
                  <label>Delay</label>
                  <label>Time</label>
                  <input type="range" min="0" max="1" step="0.01" value={config.effects?.delayTime||0.3} onChange={e=>updateEffect('delayTime',+e.target.value)} />
                  <input type="number" value={config.effects?.delayTime||0.3} step="0.01" onChange={e=>updateEffect('delayTime',+e.target.value)} />
                </div>
                <div className="effect-row">
                  <span style={{width:'16px'}}></span>
                  <label>Fdbk</label>
                  <input type="range" min="0" max="0.9" step="0.01" value={config.effects?.delayFeedback||0.4} onChange={e=>updateEffect('delayFeedback',+e.target.value)} />
                  <input type="number" value={config.effects?.delayFeedback||0.4} step="0.01" onChange={e=>updateEffect('delayFeedback',+e.target.value)} />
                </div>
                <div className="effect-row">
                  <span style={{width:'16px'}}></span>
                  <label>Wet</label>
                  <input type="range" min="0" max="1" step="0.01" value={config.effects?.delayWet||0.5} onChange={e=>updateEffect('delayWet',+e.target.value)} />
                  <input type="number" value={config.effects?.delayWet||0.5} step="0.01" onChange={e=>updateEffect('delayWet',+e.target.value)} />
                </div>

                <div className="effect-row">
                  <input type="checkbox" checked={config.effects?.reverbEnabled||false} onChange={e=>updateEffect('reverbEnabled',e.target.checked)} />

    function Sidebar({ sounds, selectedId, onSelect, onEdit, onImport, onSave, onOpen, setShowNameModal, setShowExportModal }) {

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImportFileName(file.name);
        setImportLoading(true);
        const reader = new FileReader();
        reader.onload = (ev) => {
          const arrayBuffer = ev.target.result;
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          ctx.decodeAudioData(arrayBuffer).then((audioBuffer) => {
            onImport(file.name.replace(/\.[^.]+$/, ''), audioBuffer);
            setImportLoading(false);
          }).catch((err) => {
            console.error('Failed to decode audio:', err);
            setImportLoading(false);
          });
        };
        reader.readAsArrayBuffer(file);
        e.target.value = null;
      };

      const handleOpenChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const json = JSON.parse(ev.target.result);
          onOpen(json);

        reader.readAsText(file);
        e.target.value = null;
