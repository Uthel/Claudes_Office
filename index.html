    // ---------- Sequencer (unchanged) ----------
    function Sequencer({ clips, tracks, currentStep, onDeleteClip, onSelectClip, selectedClipId, onMoveClip, sounds, arrangementLength }) {
      const containerRef = useRef(null);
      const [drag, setDrag] = useState(null);
      const [preview, setPreview] = useState(null);

      useEffect(() => {
        if (containerRef.current) {
          const el = containerRef.current;
          const left = currentStep * STEP_WIDTH - el.clientWidth / 2;
          el.scrollLeft = Math.max(0, Math.min(left, el.scrollWidth - el.clientWidth));
        }
      }, [currentStep]);

      useEffect(() => {
        if (!drag) return;
        const handleMouseMove = (e) => {
          const container = containerRef.current;
          if (!container) return;
          const rect = container.getBoundingClientRect();
          const scrollLeft = container.scrollLeft;
          const x = e.clientX - rect.left + scrollLeft;
          const y = e.clientY - rect.top + container.scrollTop;
          const rawX = x - drag.offsetX;
          const clipSteps = drag.clipSteps || STEPS;
          const stepX = Math.max(0, Math.min(arrangementLength - clipSteps, Math.round(rawX / STEP_WIDTH)));
          const trackIndex = Math.floor(y / 40);
          const trackId = tracks[trackIndex]?.id || null;
          setPreview({ x: stepX * STEP_WIDTH, trackId });
        };
        const handleMouseUp = () => {
          if (preview && preview.trackId) {
            onMoveClip(drag.clipId, preview.x / STEP_WIDTH, preview.trackId);
          }
          setDrag(null);
          setPreview(null);
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
        return () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
      }, [drag, preview, tracks, onMoveClip]);

      const handleMouseDown = (e, clip) => {
        e.preventDefault();
        e.stopPropagation();
        const container = containerRef.current;
        if (!container) return;
        const rect = container.getBoundingClientRect();
        const offsetX = e.clientX - rect.left + container.scrollLeft - clip.startStep * STEP_WIDTH;
        const offsetY = e.clientY - rect.top + container.scrollTop - (tracks.findIndex(t => t.id === clip.trackId) * 40);
        setDrag({ clipId: clip.id, offsetX, offsetY, startStep: clip.startStep, trackId: clip.trackId, clipSteps: clip.steps || STEPS });
        onSelectClip(clip.id);
      };

      return (
        <div className="sequencer-container">
          <div className="sequencer-toolbar">
            <span style={{color:'var(--text-dim)', fontSize:'0.9rem'}}>Sequencer</span>
            <span style={{color:'var(--text-dim)', fontSize:'0.8rem', marginLeft:'auto'}}>{clips.length} clips</span>
          </div>
          <div className="sequencer-tracks" ref={containerRef}>
            {tracks.map((track, tIdx) => {
              const trackClips = clips.filter(c => c.trackId === track.id);
              return (
                <div key={track.id} className="track">
                  <div className="track-label">
                    <span>{track.name.length > 18 ? track.name.slice(0,18) + '…' : track.name}</span>
                    <button className="danger" onClick={() => onDeleteClip(track.id)} title="Delete track">✕</button>
                  </div>
                  <div className="track-timeline" style={{ width: arrangementLength * STEP_WIDTH }}>
                    {trackClips.map(clip => {
                      const clipKey = clip.id;
                      const clipWidth = (clip.steps || STEPS) * STEP_WIDTH;
                      return (
                        <div
                          key={clipKey}
                          className={`clip ${selectedClipId === clip.id ? 'selected' : ''} ${drag?.clipId === clip.id ? 'dragging' : ''}`}
                          style={{ left: (drag?.clipId === clip.id ? preview?.x || clip.startStep * STEP_WIDTH : clip.startStep * STEP_WIDTH), width: clipWidth, background: clip.color || 'var(--primary)' }}
                          onMouseDown={(e) => handleMouseDown(e, clip)}
                          title="Drag to move"
                        >
                          <MiniPianoRoll notes={clip.notes || []} steps={clip.steps || STEPS} width={clipWidth} />
                        </div>
                      );
                    })}
                    {preview && preview.trackId === track.id && (
                      <div className="clip-preview" style={{ left: preview.x, width: (clips.find(c => c.id === drag?.clipId)?.steps || STEPS) * STEP_WIDTH }} />
                    )}
                    <div className="sequencer-step-line" style={{ left: currentStep * STEP_WIDTH }} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ---------- Miniature Piano Roll for Sequencer Clips ----------
    const MiniPianoRoll = ({ notes, steps, width }) => {
      const canvasRef = useRef(null);
      const height = 40;

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, width, height);
        
        if (!notes || notes.length === 0) return;
        
        const totalTicks = steps * SUBDIVISIONS;
        const scaleX = width / totalTicks;
        const scaleY = height / PITCHES.length;
        
        for (const note of notes) {
          const x = note.start * scaleX;
          const y = note.pitch * scaleY;
          const w = note.length * scaleX;
          const h = scaleY;
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 1;
          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);
        }
      }, [notes, steps, width]);

      return <canvas ref={canvasRef} width={width} height={height} style={{ position:'absolute', top:0, left:0, zIndex:0, background:'transparent', pointerEvents:'none' }} />;
    };

    // ---------- Piano Roll (with note list and resizable lengths) ----------
    function PianoRoll({ notes: rawNotes, currentStep, onNotesChange, selectedSound, onPlacePattern, gridSteps, onGridStepsChange, bpm }) {
      const notes = Array.isArray(rawNotes) ? rawNotes : [];
      const localStep = currentStep % STEPS;
      const canvasRef = useRef(null);
      const notesRef = useRef(notes);
      useEffect(() => { notesRef.current = notes; }, [notes]);
      const [dragState, setDragState] = useState(null);
      const [resizing, setResizing] = useState(false);
      const resizeRef = useRef({ startX: 0, startSteps: 0 });

      useEffect(() => {
        if (canvasRef.current) {
          drawPianoKeyboard(canvasRef.current, PITCHES, SHARPS);
        }
      }, []);

      const handleResizeMouseDown = (e) => {
        e.preventDefault();
        setResizing(true);
        resizeRef.current = { startX: e.clientX, startSteps: gridSteps };
      };

      useEffect(() => {
        if (!resizing) return;
        const handleMouseMove = (e) => {
          const delta = e.clientX - resizeRef.current.startX;
          const stepDelta = Math.round(delta / CELL_WIDTH);
          const newSteps = Math.max(1, Math.min(64, resizeRef.current.startSteps + stepDelta));
          onGridStepsChange(newSteps);
        };
        const handleMouseUp = () => {
          setResizing(false);
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
        return () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
      }, [resizing, onGridStepsChange]);

      // Create a new note on empty cell (one 16th note = 4 ticks, or full sample duration)
      const handleCellClick = (row, col, e) => {
        e.preventDefault();
        const tick = col * SUBDIVISIONS;
        const currentNotes = notesRef.current;
        const exists = currentNotes.some(n => n.pitch === row && tick >= n.start && tick < n.start + n.length);
        if (!exists) {
          let noteLength = SUBDIVISIONS; // default one 16th
          if (selectedSound && selectedSound.type === 'sample' && selectedSound.buffer) {
            const durationSec = selectedSound.buffer.duration;
            const ticksPerSec = (bpm || 120) * 4 * SUBDIVISIONS / 60;
            noteLength = Math.max(1, Math.round(durationSec * ticksPerSec));
          }
          onNotesChange([...currentNotes, { id: Date.now(), pitch: row, start: tick, length: noteLength }]);
          // Auto-expand grid if note extends beyond current steps (debounced)
          const endCell = Math.ceil((tick + noteLength) / SUBDIVISIONS);
          if (endCell > gridSteps && onGridStepsChange) {
            const targetSteps = endCell;
            let current = gridSteps;
            const expandStep = () => {
              current += Math.ceil((targetSteps - current) / 4);
              if (current >= targetSteps) {
                onGridStepsChange(targetSteps);
              } else {
                onGridStepsChange(current);
                requestAnimationFrame(expandStep);
              }
            };
            requestAnimationFrame(expandStep);
          }
        }
      };

      // Delete a note by id
      const isResizing = useRef(false);
      const handleNoteClick = (id, e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isResizing.current) return; // ignore click after resize
        const currentNotes = notesRef.current;
        onNotesChange(currentNotes.filter(n => n.id !== id));
      };

      // Resize start (all units in 64th-note ticks)
      const handleResizeStart = (id, e) => {
        e.preventDefault();
        e.stopPropagation();
        const currentNotes = notesRef.current;
        const note = currentNotes.find(n => n.id === id);
        if (!note) return;
        isResizing.current = true;
        setDragState({ id, startTick: note.start, currentLength: note.length });
      };

      // Global mouse move/up when resizing
      useEffect(() => {
        if (!dragState) return;

        const handleMove = (ev) => {
          const gridEl = document.querySelector('.grid');
          if (!gridEl) return;
          const rect = gridEl.getBoundingClientRect();
          const x = ev.clientX - rect.left;
          const tick = Math.max(0, Math.floor(x / TICK_WIDTH));
          const maxLen = gridSteps * SUBDIVISIONS - dragState.startTick;
          const newLen = Math.max(1, Math.min(tick - dragState.startTick + 1, maxLen));
          setDragState(prev => ({ ...prev, currentLength: newLen }));
        };

        const handleUp = () => {
          // Commit final length
          const finalLen = dragState.currentLength;
          const latestNotes = notesRef.current;
          const newNotes = latestNotes.map(n => {
            if (n.id === dragState.id) {
              return { ...n, length: finalLen };
            }
            return n;
          });
          onNotesChange(newNotes);
          setDragState(null);
          document.removeEventListener('mousemove', handleMove);
          document.removeEventListener('mouseup', handleUp);
          // Reset the resizing flag after a microtask to allow the click event to be suppressed
          setTimeout(() => { isResizing.current = false; }, 0);
        };

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleUp);
        return () => {
          document.removeEventListener('mousemove', handleMove);
          document.removeEventListener('mouseup', handleUp);
        };
      }, [dragState, onNotesChange]);

      // Compute display width in pixels from ticks
      const toPixels = (ticks) => ticks * TICK_WIDTH;
      const getDisplayLength = (note) => {
        if (dragState && dragState.id === note.id) {
          return dragState.currentLength;
        }
        return note.length;
      };

      // Build subdivision lines for 32nd and 64th notes
      const subLines = useMemo(() => {
        const lines = [];
        for (let col = 0; col < gridSteps; col++) {
          lines.push({ left: col * CELL_WIDTH + 2 * TICK_WIDTH, thin: false });
          lines.push({ left: col * CELL_WIDTH + 1 * TICK_WIDTH, thin: true });
          lines.push({ left: col * CELL_WIDTH + 3 * TICK_WIDTH, thin: true });
        }
        return lines;
      }, [gridSteps]);

      return (
        <div className="piano-roll-container">
          <div className="piano-roll-toolbar">
            <span style={{color:'var(--text-dim)', fontSize:'0.9rem'}}>Piano Roll — {selectedSound?.name || 'No sound selected'}</span>
            {selectedSound && (
              <button className="gold" onClick={onPlacePattern}>Place Pattern in Sequencer</button>
            )}
          </div>
          <div className="piano-roll-grid-wrapper">
            <div className="piano-labels">
              <canvas ref={canvasRef} width="70" height={PITCHES.length * 20} />
            </div>
            <div className="grid-scroll">
              <div className="grid-wrapper" style={{ width: gridSteps * CELL_WIDTH, position: 'relative' }}>
              <div className="grid" style={{'--cell-width': CELL_WIDTH + 'px', gridTemplateColumns: 'repeat(' + gridSteps + ', var(--cell-width))'}}>
              <div className="subdivision-lines">
              {subLines.map((line, i) => (
              <div key={i} className={`sub-line ${line.thin ? 'thin' : ''}`} style={{ left: line.left }} />
              ))}
              </div>
              {PITCHES.map((pitch, row) =>
              Array.from({length: gridSteps}, (_, col) => (
              <div
              key={`${row}-${col}`}
              className="cell"
              onMouseDown={(e) => handleCellClick(row, col, e)}
              />
              ))
              )}
              </div>
                <div className="piano-roll-resize-handle" onMouseDown={handleResizeMouseDown} title="Drag to resize pattern length" />
                <div className="note-overlay">
                  {notes.map((note) => (
                    <div
                      key={note.id}
                      className="note-block"
                      style={{
                        top: note.pitch * 20,
                        left: toPixels(note.start),
                        width: toPixels(getDisplayLength(note)),
                        height: 20
                      }}
                      onClick={(e) => handleNoteClick(note.id, e)}
                    >
                      <div
                        className="resize-handle"
                        onMouseDown={(e) => handleResizeStart(note.id, e)}
                        onClick={(e) => e.stopPropagation()}
                      />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ---------- App ----------
    function App() {
      const engineRef = useRef(new AudioEngine());
      const [sounds, setSounds] = useState([]);
      const [selectedId, setSelectedId] = useState(null);
      const [editingSound, setEditingSound] = useState(null);
      const [playing, setPlaying] = useState(false);
      const [bpm, setBpm] = useState(120);
      const [currentStep, setCurrentStep] = useState(0);
      const [patterns, setPatterns] = useState({}); // { [soundId]: note[] }
      const [clips, setClips] = useState([]);
      const [tracks, setTracks] = useState([]);
      const [selectedClipId, setSelectedClipId] = useState(null);
      const [nextTrackId, setNextTrackId] = useState(1);
      const [gridSteps, setGridSteps] = useState(16);
      const [totalDuration, setTotalDuration] = useState(8);
      const [masterVolume, setMasterVolume] = useState(80);
      const [projectName, setProjectName] = useState('');
      const [showNameModal, setShowNameModal] = useState(false);
      const [showExportModal, setShowExportModal] = useState(false);
      const arrangementLength = useMemo(() => Math.max(1, Math.round(totalDuration * bpm * 4 / 60)), [totalDuration, bpm]);
      const voicePoolsRef = useRef({});
      const sampleVoicePoolsRef = useRef({}); // { [soundId]: SampleVoicePool }

      const addSound = useCallback(s => setSounds(prev => [...prev, { ...s, id: Date.now() }]), []);
      const handleImportSound = useCallback((name, buffer) => {
        setSounds(prev => [...prev, { id: Date.now(), name, type:'sample', buffer }]);
      }, []);
      const updateSound = useCallback((id, updated) => setSounds(prev => prev.map(s => s.id===id ? { ...s, ...updated } : s)), []);
      const libraryValue = useMemo(() => ({ sounds, addSound, updateSound }), [sounds, addSound, updateSound]);
      const selectedSound = useMemo(() => sounds.find(s => s.id === selectedId) || null, [sounds, selectedId]);
      useEffect(() => {
        setGridSteps(16);
      }, [selectedId]);

      const notes = useMemo(() => {
        if (!selectedId) return [];
        return patterns[selectedId] || [];
      }, [patterns, selectedId]);

      const handleNotesChange = useCallback((newNotes) => {
        if (!selectedId) return;
        setPatterns(prev => ({ ...prev, [selectedId]: newNotes }));
      }, [selectedId]);

      const usedColorSlots = useRef(new Set());
      const getNextColorSlot = () => {
        let slot = 0;
        while (usedColorSlots.current.has(slot)) slot++;
        usedColorSlots.current.add(slot);
        const hue = (slot * 137.5) % 360;
        return { slot, color: `hsl(${hue}, 55%, 72%)` };
      };
      const releaseColorSlot = (slot) => {
        usedColorSlots.current.delete(slot);
      };
      const handlePlacePattern = useCallback(() => {
        if (!selectedId || !selectedSound) return;
        const currentNotes = notes;
        const trackId = `track_${nextTrackId}`;
        const { slot, color } = getNextColorSlot();
        const newTrack = { id: trackId, name: selectedSound.name, soundId: selectedId, color, colorSlot: slot };
        const newClip = {
          id: `clip_${Date.now()}`,
          trackId,
          soundId: selectedId,
          startStep: 0,
          steps: gridSteps,
          notes: currentNotes.map(n => ({...n})),
          color
        };
        setTracks(prev => [...prev, newTrack]);
        setClips(prev => [...prev, newClip]);
        setNextTrackId(id => id + 1);
        // Auto-expand song length if clip extends beyond current arrangement
        const clipEndStep = newClip.startStep + newClip.steps;
        if (clipEndStep > arrangementLength) {
          const extraDuration = (clipEndStep - arrangementLength) * 60 / (bpm * 4);
          const targetDuration = Math.ceil((totalDuration + extraDuration) * 10) / 10;
          let current = totalDuration;
          const expandStep = () => {
            current += (targetDuration - current) / 4;
            if (current >= targetDuration) {
              setTotalDuration(targetDuration);
            } else {
              setTotalDuration(Math.ceil(current * 10) / 10);
              requestAnimationFrame(expandStep);
            }
          };
          requestAnimationFrame(expandStep);
        }
      }, [selectedId, selectedSound, notes, nextTrackId, gridSteps, arrangementLength, bpm, setTotalDuration]);

      const handleDeleteClip = useCallback((trackId) => {
        const deletedTrack = tracksRef.current.find(t => t.id === trackId);
        if (deletedTrack?.colorSlot !== undefined) {
          releaseColorSlot(deletedTrack.colorSlot);
        }
        setClips(prev => prev.filter(c => c.trackId !== trackId));
        setTracks(prev => prev.filter(t => t.id !== trackId));
        if (selectedClipId && clipsRef.current.find(c => c.id === selectedClipId)?.trackId === trackId) {
          setSelectedClipId(null);
        }
      }, [selectedClipId]);

      const handleSelectClip = useCallback((clipId) => {
        setSelectedClipId(prev => prev === clipId ? null : clipId);
      }, []);

      const handleMoveClip = useCallback((clipId, newStartStep, newTrackId) => {
        const targetTrack = tracks.find(t => t.id === newTrackId);
        const clip = clips.find(c => c.id === clipId);
        let newSoundId = clip?.soundId;
        let newColor = clip?.color;
        if (targetTrack) {
          // Inherit sound and color from destination track
          if (targetTrack.soundId) newSoundId = targetTrack.soundId;
          if (targetTrack.color) {
            newColor = targetTrack.color;
          } else {
            // Legacy track without color: generate one based on its index
            const idx = tracks.indexOf(targetTrack);
            const hue = (idx * 137.5) % 360;
            newColor = `hsl(${hue}, 55%, 72%)`;
            // Store the color on the track so it persists
            setTracks(prev => prev.map(t => t.id === newTrackId ? { ...t, color: newColor } : t));
          }
        }
        setClips(prev => prev.map(c => {
          if (c.id === clipId) {
            return { ...c, startStep: newStartStep, trackId: newTrackId, soundId: newSoundId, color: newColor };
          }
          return c;
        }));
        setTracks(prev => {
          if (!prev.some(t => t.id === newTrackId)) {
            const snd = sounds.find(s => s.id === newSoundId);
            const { slot: newSlot, color: assignedColor } = getNextColorSlot();
            return [...prev, { id: newTrackId, name: snd?.name || 'Unknown', soundId: newSoundId, color: assignedColor, colorSlot: newSlot }];
          }
          return prev;
        });
      }, [clips, tracks, sounds]);

      // Scheduler
      const schedulerRef = useRef(null);
      const clipsRef = useRef(clips);
      clipsRef.current = clips;
      const tracksRef = useRef(tracks);
      tracksRef.current = tracks;
      const soundsRef = useRef(sounds);
      soundsRef.current = sounds;

      useEffect(() => {
        if (playing) {
          const ctx = engineRef.current.getContext();
          schedulerRef.current = new Scheduler(ctx);
          schedulerRef.current.start(bpm, arrangementLength, (step, time) => {
            setCurrentStep(step);
            const currentClips = clipsRef.current;
            const currentSounds = soundsRef.current;
            for (const clip of currentClips) {
              const localStep = step - clip.startStep;
              if (localStep < 0 || localStep >= (clip.steps || STEPS)) continue;
              const snd = currentSounds.find(s => s.id === clip.soundId);
              if (!snd) continue;
              const noteList = clip.notes || [];
              if (snd.type === 'sample' && snd.buffer) {
                // Sample sound
                let pool = sampleVoicePoolsRef.current[snd.id];
                if (!pool) {
                  pool = new SampleVoicePool(ctx, engineRef.current, snd.buffer, 4);
                  sampleVoicePoolsRef.current[snd.id] = pool;
                }
                for (const note of noteList) {
                  const noteStartTicks = note.start;
                  const noteLengthTicks = note.length;
                  const noteStartStep = Math.floor(noteStartTicks / SUBDIVISIONS);
                  if (localStep === noteStartStep) {
                    const pitchIndex = PITCHES.length - 1 - note.pitch;
                    const freq = freqFromPitch(PITCHES[pitchIndex]);
                    const noteDurationSec = (noteLengthTicks * 60) / (bpm * SUBDIVISIONS * 4);
                    const voice = pool.getVoice();
                    voice.play(snd.buffer, freq, time, noteDurationSec);
                  }
                }
              } else {
                // Synth sound
                let pool = voicePoolsRef.current[snd.id];
                if (!pool) {
                  pool = new SynthVoicePool(ctx, engineRef.current, snd.config || {}, 8);
                  voicePoolsRef.current[snd.id] = pool;
                } else {
                  pool.updateConfig(snd.config || {});
                }
                for (const note of noteList) {
                  const noteStartTicks = note.start;
                  const noteLengthTicks = note.length;
                  const noteStartStep = Math.floor(noteStartTicks / SUBDIVISIONS);
                  if (localStep === noteStartStep) {
                    const pitchIndex = PITCHES.length - 1 - note.pitch;
                    const freq = freqFromPitch(PITCHES[pitchIndex]);
                    const noteDurationSec = (noteLengthTicks * 60) / (bpm * SUBDIVISIONS * 4);
                    const voice = pool.getVoice();
                    voice.play(freq, time, noteDurationSec);
                  }
                }
              }
            }
          });
          return () => { if(schedulerRef.current) schedulerRef.current.stop(); };
        } else {
          if(schedulerRef.current) schedulerRef.current.stop();
        }
      }, [playing, bpm, arrangementLength]);

      const handlePlay = () => setPlaying(true);
      const handleStop = () => {
        setPlaying(false);
        // Stop all synth voices
        for (const id in voicePoolsRef.current) {
          voicePoolsRef.current[id].releaseAll();
        }
        // Stop all sample voices
        for (const id in sampleVoicePoolsRef.current) {
          sampleVoicePoolsRef.current[id].releaseAll();
        }
      };
      const handleReturnToStart = () => {
        if (schedulerRef.current) {
          schedulerRef.current.reset();
        }
        setCurrentStep(0);
      };
      const handleVolumeChange = (vol) => {
        setMasterVolume(vol);
        engineRef.current.setMasterVolume(vol);
      };
      const handleEdit = (sound) => setEditingSound(sound);

      const handleSave = (name) => {
        if (name) setProjectName(name);
        setShowNameModal(false);
        const project = {
          version: 1,
          name: name || projectName || 'Untitled',
          bpm,
          totalDuration,
          gridSteps,
          sounds: sounds.map(s => ({
            id: s.id,
            name: s.name,
            type: s.type,
            config: s.type === 'synth' ? s.config : undefined,
            // sample buffer not stored; must re-import
            sampleName: s.type === 'sample' ? s.name : undefined,
          })),
          patterns,
          clips,
          tracks,
          nextTrackId,
        };
        const json = JSON.stringify(project, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (name || projectName || 'project') + '.overtone.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleExport = async (filename, format) => {
        const sampleRate = 44100;
        const totalTime = totalDuration;
        const offlineCtx = new OfflineAudioContext(2, Math.max(1, sampleRate * totalTime), sampleRate);

        const offlineMaster = offlineCtx.createGain();
        offlineMaster.gain.value = masterVolume / 100;
        offlineMaster.connect(offlineCtx.destination);

        let scheduledCount = 0;
        const stepDur = 60 / bpm / 4;

        if (clips.length === 0 && sounds.some(s => s.type === 'synth')) {
          // No clips, but there are synth sounds: render a short test tone to prove pipeline works
          const osc = offlineCtx.createOscillator();
          const gain = offlineCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 440;
          gain.gain.setValueAtTime(0, 0);
          gain.gain.linearRampToValueAtTime(0.3, 0.01);
          gain.gain.linearRampToValueAtTime(0, 1);
          osc.connect(gain);
          gain.connect(offlineMaster);
          osc.start(0);
          osc.stop(1);
          scheduledCount = 1;
        } else {
          for (const clip of clips) {
            const snd = sounds.find(s => s.id === clip.soundId);
            if (!snd) continue;
            const noteList = clip.notes || [];
            for (const note of noteList) {
              const noteStartTicks = note.start;
              const noteLengthTicks = note.length;
              const noteStartStep = Math.floor(noteStartTicks / SUBDIVISIONS);
              const noteTime = clip.startStep * stepDur + noteStartStep * stepDur;
              const noteDurationSec = (noteLengthTicks * 60) / (bpm * SUBDIVISIONS * 4);
              if (noteTime >= totalTime) continue;
              scheduledCount++;
              if (snd.type === 'sample' && snd.buffer) {
                const src = offlineCtx.createBufferSource();
                src.buffer = snd.buffer;
                const pitchIndex = PITCHES.length - 1 - note.pitch;
                const freq = freqFromPitch(PITCHES[pitchIndex]);
                src.playbackRate.value = freq / 440;
                src.connect(offlineMaster);
                src.start(noteTime, 0, Math.min(noteDurationSec, totalTime - noteTime));
              } else if (snd.config) {
                const osc = offlineCtx.createOscillator();
                const gain = offlineCtx.createGain();
                const cfg = snd.config;
                osc.type = cfg.type || 'sine';
                osc.frequency.value = freqFromPitch(PITCHES[PITCHES.length - 1 - note.pitch]);
                const now = noteTime;
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(cfg.gain || 0.3, now + (cfg.attack || 0.01));
                gain.gain.linearRampToValueAtTime((cfg.sustain || 0.6) * (cfg.gain || 0.3), now + (cfg.attack || 0.01) + (cfg.decay || 0.1));
                gain.gain.linearRampToValueAtTime(0, now + noteDurationSec);
                osc.connect(gain);
                gain.connect(offlineMaster);
                osc.start(now);
                osc.stop(now + noteDurationSec + 0.1);
              }
            }
          }
        }

        console.log(`Scheduled ${scheduledCount} notes for export (${totalTime}s, ${clips.length} clips, ${sounds.length} sounds)`);
        if (scheduledCount > 0) {
          const firstClip = clips[0];
          if (firstClip) {
            const firstNote = firstClip.notes[0];
            if (firstNote) {
              const dur = (firstNote.length * 60) / (bpm * SUBDIVISIONS * 4);
              console.log(`First note duration: ${firstNote.length} ticks = ${dur.toFixed(2)}s, pitch row: ${firstNote.pitch}`);
            }
          }
        }
        const renderedBuffer = await offlineCtx.startRendering();
        const wavBlob = audioBufferToWav(renderedBuffer);
        const url = URL.createObjectURL(wavBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (filename || 'export') + '.wav';
        a.click();
        URL.revokeObjectURL(url);
      };

      // WAV encoder
      const audioBufferToWav = (buffer) => {
        const numChannels = buffer.numberOfChannels;
        const length = buffer.length * numChannels * 2 + 44;
        const arrayBuffer = new ArrayBuffer(length);
        const view = new DataView(arrayBuffer);
        const writeString = (offset, string) => {
          for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, length - 8, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, buffer.sampleRate, true);
        view.setUint32(28, buffer.sampleRate * numChannels * 2, true);
        view.setUint16(32, numChannels * 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, length - 44, true);
        let offset = 44;
        for (let i = 0; i < buffer.length; i++) {
          for (let ch = 0; ch < numChannels; ch++) {
            const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
            const int16 = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            view.setInt16(offset, int16, true);
            offset += 2;
          }
        }
        return new Blob([arrayBuffer], { type: 'audio/wav' });
      };

      const handleOpen = (project) => {
        // Restore project name
        if (project.name) setProjectName(project.name);
        // Restore simple state
        if (project.bpm) setBpm(project.bpm);
        if (project.totalDuration) setTotalDuration(project.totalDuration);
        if (project.gridSteps) setGridSteps(project.gridSteps);
        if (project.nextTrackId) setNextTrackId(project.nextTrackId);
        if (project.patterns) setPatterns(project.patterns);
        if (project.clips) setClips(project.clips);
        if (project.tracks) {
          setTracks(project.tracks);
          // Repopulate usedColorSlots
          project.tracks.forEach(t => {
            if (t.colorSlot !== undefined) usedColorSlots.current.add(t.colorSlot);
          });
        }
        // Restore sounds: synth sounds have config; sample sounds need re-import
        const synths = (project.sounds || []).filter(s => s.type !== 'sample').map(s => ({
          id: s.id, name: s.name, type: 'synth', config: s.config
        }));
        const samples = (project.sounds || []).filter(s => s.type === 'sample');
        setSounds(synths);
        // Prompt to re-import each sample sound
        if (samples.length > 0) {
          let idx = 0;
          const importNext = () => {
            if (idx >= samples.length) return;
            const s = samples[idx++];
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'audio/*';
            input.onchange = (e) => {
              const file = e.target.files[0];
              if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                  const arrayBuffer = ev.target.result;
                  const ctx = engineRef.current.getContext();
                  ctx.decodeAudioData(arrayBuffer).then((buffer) => {
                    setSounds(prev => [...prev, { id: s.id, name: s.name || file.name.replace(/\.[^.]+$/, ''), type:'sample', buffer }]);
                    importNext();
                  }).catch(() => importNext());
                };
                reader.readAsArrayBuffer(file);
              } else {
                importNext();
              }
            };
            input.click();
          };
          importNext();
        }
      };

      return (
        <EngineContext.Provider value={engineRef.current}>
          <SoundLibraryContext.Provider value={libraryValue}>
            <TransportBar
              playing={playing}
              onPlay={handlePlay}
              onStop={handleStop}
              onReturnToStart={handleReturnToStart}
              bpm={bpm}
              onBpmChange={setBpm}
              totalDuration={totalDuration}
              onTotalDurationChange={setTotalDuration}
              arrangementLength={arrangementLength}
              masterVolume={masterVolume}
              onVolumeChange={handleVolumeChange}
              projectName={projectName}
            />
            <div className="app-layout">
              <Sidebar
                sounds={sounds}
                selectedId={selectedId}
                onSelect={setSelectedId}
                onEdit={handleEdit}
                onImport={handleImportSound}
                onSave={handleSave}
                onOpen={handleOpen}
                setShowNameModal={setShowNameModal}
                setShowExportModal={setShowExportModal}
              />
              <div className="main-area">
                <Sequencer
                  clips={clips}
                  tracks={tracks}
                  currentStep={currentStep}
                  onDeleteClip={handleDeleteClip}
                  onSelectClip={handleSelectClip}
                  selectedClipId={selectedClipId}
                  onMoveClip={handleMoveClip}
                  sounds={sounds}
                  arrangementLength={arrangementLength}
                />
                <PianoRoll
                  notes={notes}
                  currentStep={currentStep}
                  onNotesChange={handleNotesChange}
                  selectedSound={selectedSound}
                  onPlacePattern={handlePlacePattern}
                  gridSteps={gridSteps}
                  onGridStepsChange={setGridSteps}
                  bpm={bpm}
                />
              </div>
            </div>
            {showExportModal && (
              <ExportModal
                projectName={projectName}
                onExport={handleExport}
                onClose={() => setShowExportModal(false)}
              />
            )}
            {showNameModal && (
              <NameProjectModal
                initialName={projectName}
                onSave={(name) => handleSave(name)}
                onClose={() => setShowNameModal(false)}
              />
            )}
            {editingSound && (
              <SoundModal
                initialSound={editingSound}
                onClose={() => setEditingSound(null)}
              />
            )}
          </SoundLibraryContext.Provider>
        </EngineContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
