<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unicode Raycaster</title>
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  UNICODE PER-CELL RAYCASTER — skeleton / handoff document       ║
  ╠══════════════════════════════════════════════════════════════════╣
  ║  ARCHITECTURE OVERVIEW                                          ║
  ║                                                                  ║
  ║  Instead of rasterising triangles, this renderer casts one ray  ║
  ║  per character cell. Each ray is tested against the scene in    ║
  ║  order; the nearest hit wins. This gives correct occlusion and  ║
  ║  solid fills without a z-buffer or painter's sort.              ║
  ║                                                                  ║
  ║  COORDINATE SYSTEM                                              ║
  ║    +X = right   +Y = up   +Z = forward (into screen)           ║
  ║    Map tiles live on the XZ plane. Y=0 is floor, Y=1 ceiling.  ║
  ║    One tile = one world unit.                                    ║
  ║                                                                  ║
  ║  RENDER PIPELINE (per frame)                                    ║
  ║    1. rebuildRayDirs() — if cam yaw/pitch changed, recompute    ║
  ║       the full COLS×ROWS table of normalised world-space ray    ║
  ║       directions. Cached between frames when camera is still.   ║
  ║    2. For each cell (cx,cy):                                    ║
  ║       a. Look up precomputed ray direction (rdx,rdy,rdz)        ║
  ║       b. Test walls  — rayAABB vs each solid tile AABB          ║
  ║       c. Test floor  — ray vs Y=0 plane                         ║
  ║       d. Test ceiling — ray vs Y=1 plane                        ║
  ║       e. Test pickup cube — ray vs spinning AABB                ║
  ║       f. Take nearest hit; shade with diffuse+ambient+fog       ║
  ║       g. Map brightness → character ramp; fillText to canvas    ║
  ║                                                                  ║
  ║  ADDING GEOMETRY                                                 ║
  ║    • New static walls: add tiles to MAP[]                       ║
  ║    • New AABB objects: call rayAABB in the per-cell loop,       ║
  ║      same pattern as the pickup cube section                    ║
  ║    • Non-axis-aligned surfaces: transform ray into object space  ║
  ║      (see pickup cube: rotate ro/rd by -pickYaw before test,    ║
  ║       rotate normal back by +pickYaw after)                     ║
  ║                                                                  ║
  ║  PERFORMANCE NOTES                                              ║
  ║    • rayDirs is a flat Float64Array (no object allocation).     ║
  ║    • rayAABB is fully inlined scalars — no vec3 objects.        ║
  ║    • wallTiles is prefiltered to solid tiles only.              ║
  ║    • ctx.font is set once per frame outside the cell loop.      ║
  ║    • At 80×40 cells this runs comfortably at 60 fps in JS.      ║
  ║      If adding many objects, consider a BVH or spatial grid.    ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; }
body {
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; font-family:'Courier New',monospace;
}
canvas { display:block; image-rendering:pixelated; cursor:none; }

#crosshair {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:#ffffff44; font-size:16px;
  pointer-events:none; user-select:none;
}

#hud-root {
  position:absolute; bottom:0; left:0; right:0;
  display:flex; flex-direction:column; align-items:center;
  pointer-events:none; z-index:10;
  font-family:'Courier New',monospace; color:#ccc;
  padding-bottom:8px;
}
.hud-bars {
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.combat-log {
  position:absolute; bottom:8px; left:8px;
  width:300px; height:80px; overflow-y:auto;
  background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:4px;
  font-size:11px; line-height:1.3; color:#ccc;
  pointer-events:none; z-index:10;
  font-family:'Courier New',monospace;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.combat-log::-webkit-scrollbar { display: none; }
.hud-bar-container {
  display:flex; align-items:center; gap:8px; margin-bottom:4px;
  background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:4px;
}
.hud-bar-label { font-size:12px; width:60px; text-align:right; }
.hud-bar-bg { width:200px; height:14px; background:#222; border:1px solid #444; }
.hud-bar-fill { height:100%; width:0%; }
.hud-bar-text { font-size:10px; color:#aaa; margin-left:4px; }
.combat-log {
  width:400px; height:100px; overflow-y:auto;
  background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:4px;
  font-size:11px; line-height:1.3; margin-top:6px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud-root"></div>
<div id="crosshair">+</div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>

// ═══════════════════════════════════════════════════════════════════
//  CHARACTER GRID
//  The canvas is divided into COLS×ROWS cells, each CW×CH pixels.
//  CW and CH must match the actual monospace glyph dimensions —
//  CELL_ASPECT (CW/CH) corrects for non-square cells in projection.
// ═══════════════════════════════════════════════════════════════════
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');

const COLS = 80;   // character columns
const ROWS = 40;   // character rows
const CW   = 13;   // cell pixel width  (tune to match your font)
const CH   = 20;   // cell pixel height (tune to match your font)

canvas.width  = COLS * CW;
canvas.height = ROWS * CH;
ctx.textBaseline = 'top';

// ═══════════════════════════════════════════════════════════════════
//  CHARACTER BRIGHTNESS RAMP
//  Index 0 = brightest (densest ink), last index = darkest (space).
//  ramp(b) maps a brightness value [0..1] to a character.
//  Duplicate entries intentionally widen certain brightness bands.
// ═══════════════════════════════════════════════════════════════════
const RAMP = ['█','▓','▓','▒','▒','░','·',' '];

function ramp(b) {
  b = Math.max(0, Math.min(1, b));
  return RAMP[Math.floor((1 - b) * (RAMP.length - 1))];
}

// ═══════════════════════════════════════════════════════════════════
//  MATH HELPERS
//  All hot-path math uses flat scalar arguments to avoid allocating
//  {x,y,z} objects in the inner loop. Results are written into
//  pre-allocated Float64Arrays (out[]).
// ═══════════════════════════════════════════════════════════════════

// Dot product of two 3-vectors passed as scalars.
function dot3(ax,ay,az, bx,by,bz) {
  return ax*bx + ay*by + az*bz;
}

// Rotate vector (x,y,z) around the Y axis by angle a.
// Writes result into out[0..2].
function rotY3(x,y,z, a, out) {
  const c=Math.cos(a), s=Math.sin(a);
  out[0] = x*c + z*s;
  out[1] = y;
  out[2] = -x*s + z*c;
}

// Rotate vector (x,y,z) around the X axis by angle a.
// Writes result into out[0..2].
function rotX3(x,y,z, a, out) {
  const c=Math.cos(a), s=Math.sin(a);
  out[0] = x;
  out[1] = y*c - z*s;
  out[2] = y*s + z*c;
}

// ═══════════════════════════════════════════════════════════════════
//  RAY–AABB INTERSECTION  (slab method, fully inlined)
//
//  Tests a ray (origin rox,roy,roz + t*direction rdx,rdy,rdz)
//  against an axis-aligned bounding box [bmin, bmax].
//
//  Returns tNear (distance to hit, > 0) or -1 on miss.
//  On hit, writes the outward face normal into nOut[0..2].
//
//  How it works: each axis-aligned pair of planes defines a "slab".
//  The ray is inside all three slabs simultaneously over [tNear,tFar].
//  tNear = max of all slab entry distances (last slab entered).
//  tFar  = min of all slab exit  distances (first slab exited).
//  Hit if tNear <= tFar and the interval is in front of the ray.
//  The normal belongs to the axis whose slab was entered last (tNear).
// ═══════════════════════════════════════════════════════════════════
const nOut = new Float64Array(3); // shared normal output — written per hit

function rayAABB(rox,roy,roz, rdx,rdy,rdz,
                 bminx,bminy,bminz, bmaxx,bmaxy,bmaxz,
                 nOut) {
  let tNear=-1e38, tFar=1e38, hAxis=0, hSign=1;

  // X slab
  let invD=1/rdx, t0=(bminx-rox)*invD, t1=(bmaxx-rox)*invD, sg=1;
  if(invD<0){ let tmp=t0; t0=t1; t1=tmp; sg=-1; }
  if(t0>tNear){ tNear=t0; hAxis=0; hSign=sg; }
  tFar=Math.min(tFar,t1);
  if(tNear>tFar) return -1;

  // Y slab
  invD=1/rdy; t0=(bminy-roy)*invD; t1=(bmaxy-roy)*invD; sg=1;
  if(invD<0){ let tmp=t0; t0=t1; t1=tmp; sg=-1; }
  if(t0>tNear){ tNear=t0; hAxis=1; hSign=sg; }
  tFar=Math.min(tFar,t1);
  if(tNear>tFar) return -1;

  // Z slab
  invD=1/rdz; t0=(bminz-roz)*invD; t1=(bmaxz-roz)*invD; sg=1;
  if(invD<0){ let tmp=t0; t0=t1; t1=tmp; sg=-1; }
  if(t0>tNear){ tNear=t0; hAxis=2; hSign=sg; }
  tFar=Math.min(tFar,t1);
  if(tNear>tFar) return -1;

  if(tFar < 1e-4) return -1; // box entirely behind ray origin

  // Build outward normal: the axis that produced tNear, sign away from ray
  nOut[0]=0; nOut[1]=0; nOut[2]=0;
  nOut[hAxis] = -hSign;
  return tNear;
}

// ═══════════════════════════════════════════════════════════════════
//  TILE MAP
//  16×16 grid. 1 = solid wall, 0 = open floor.
//  Tiles sit on the XZ plane; each is 1×1 world units wide.
//  Walls are extruded from Y=0 (floor) to Y=1 (ceiling).
//
//  To expand the map: change MAP_W/MAP_H and update the MAP array.
//  Solid tiles are precomputed into wallTiles[] at startup.
// ═══════════════════════════════════════════════════════════════════
let MAP_W = 32, MAP_H = 32;
let MAP = [];

function generateDungeon() {
  MAP = new Array(MAP_W * MAP_H).fill(1);
  const rooms = [];
  const maxRooms = 12;
  for (let i = 0; i < 200; i++) {
    const rw = 4 + Math.floor(Math.random() * 6);
    const rh = 4 + Math.floor(Math.random() * 6);
    const rx = 1 + Math.floor(Math.random() * (MAP_W - rw - 2));
    const rz = 1 + Math.floor(Math.random() * (MAP_H - rh - 2));
    let overlap = false;
    for (const room of rooms) {
      if (rx < room.x + room.w + 1 && rx + rw + 1 > room.x &&
          rz < room.z + room.h + 1 && rz + rh + 1 > room.z) {
        overlap = true;
        break;
      }
    }
    if (!overlap) {
      rooms.push({ x: rx, z: rz, w: rw, h: rh, cx: Math.floor(rx + rw/2), cz: Math.floor(rz + rh/2) });
      for (let tx = rx; tx < rx + rw; tx++)
        for (let tz = rz; tz < rz + rh; tz++)
          MAP[tz * MAP_W + tx] = 0;
      if (rooms.length >= maxRooms) break;
    }
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i-1], b = rooms[i];
    let cx = a.cx, cz = a.cz;
    while (cx !== b.cx) {
      MAP[cz * MAP_W + cx] = 0;
      cx += cx < b.cx ? 1 : -1;
    }
    while (cz !== b.cz) {
      MAP[cz * MAP_W + cx] = 0;
      cz += cz < b.cz ? 1 : -1;
    }
  }
  if (rooms.length === 0) rooms.push({ x: 2, z: 2, w: 6, h: 6, cx: 5, cz: 5 });
  const spawnRoom = rooms[Math.floor(Math.random() * rooms.length)];
  return { x: spawnRoom.cx + 0.5, z: spawnRoom.cz + 0.5 };
}

// Returns true if tile (tx, tz) is solid (or out of bounds).
function solid(tx, tz) {
  if(tx<0 || tz<0 || tx>=MAP_W || tz>=MAP_H) return true;
  return MAP[tz * MAP_W + tx] === 1;
}

// Precompute all solid tiles as [bminX,bminY,bminZ, bmaxX,bmaxY,bmaxZ].
// This avoids recomputing tile bounds inside the hot render loop.
let wallTiles = [];
function rebuildWallTiles() {
  wallTiles = [];
  for(let tz=0; tz<MAP_H; tz++)
    for(let tx=0; tx<MAP_W; tx++)
      if(MAP[tz*MAP_W+tx]===1)
        wallTiles.push([tx,0,tz, tx+1,1,tz+1]);
}

// ── Player state (shared with React HUD) ──
let playerHealth = 100, playerMaxHealth = 100;
let playerMana = 50, playerMaxMana = 50;
let playerShield = 0;
let maxShield = 0;
let combatLog = [];
let playerDead = false;
let floorLevel = 1;
let playerAttackCooldown = 0;
const ATTACK_COOLDOWN = 0.4;
const BASE_ATTACK_DAMAGE = 20;
const ATTACK_RANGE = 10;
let setPlayerState = null;

function resetGame() {
  playerHealth = 100; playerMaxHealth = 100;
  playerMana = 50; playerMaxMana = 50;
  combatLog = [];
  playerDead = false;
  const sp = generateDungeon();
  rebuildWallTiles();
  cam.x = sp.x; cam.z = sp.z; cam.yaw = 0; cam.pitch = 0;
  enemies.length = 0;
  spawnEnemies();
  addCombatMessage('You have entered the Monospace.');
}

function addCombatMessage(msg) {
  combatLog = [...combatLog.slice(-19), msg]; // keep last 20
  if (setPlayerState) setPlayerState({ health: playerHealth, maxHealth: playerMaxHealth, mana: playerMana, maxMana: playerMaxMana, shield: playerShield, maxShield, warding: playerWarding, log: combatLog, inventory: [...inventory], equipment: {...equipment}, attackDamage, lifesteal: playerLifesteal, frostChance: playerFrostChance, echoChance: playerEchoChance, fireDamage: playerFireDamage, critChance: playerCritChance, manaOnHit: playerManaOnHit, thorns: playerThorns, xpGain: playerXpGain, paralyzeChance: playerParalyzeChance, playerSpeed: (SPEED + (recalcStats._speedBonus||0)).toFixed(1) });
}
function updateHUD() {
  if (setPlayerState) setPlayerState({ health: playerHealth, maxHealth: playerMaxHealth, mana: playerMana, maxMana: playerMaxMana, shield: playerShield, maxShield, warding: playerWarding, log: combatLog, inventory: [...inventory], equipment: {...equipment}, attackDamage, lifesteal: playerLifesteal, frostChance: playerFrostChance, echoChance: playerEchoChance, fireDamage: playerFireDamage, critChance: playerCritChance, manaOnHit: playerManaOnHit, thorns: playerThorns, xpGain: playerXpGain, paralyzeChance: playerParalyzeChance, playerSpeed: (SPEED + (recalcStats._speedBonus||0)).toFixed(1) });
}

// ── Enemy system ──
const enemies = [];
const ENEMY_RADIUS = 0.15;
const ENEMY_ATTACK_RANGE = 1.5;
const ITEM_HALF = 0.1;
const PICKUP_RANGE = 0.5;
const items = [];
const inventory = [];
const equipment = { weapon: null, head: null, chest: null, gloves: null, pants: null, belt: null, boots: null, amulet: null, ring: null };
let attackDamage = BASE_ATTACK_DAMAGE;

const AFFIXES = [
  { prefix:'Vital', suffix:'of Vigour', stat:'health', min:3, max:8 },
  { prefix:'Empowered', suffix:'of Power', stat:'damage', min:2, max:5 },
  { prefix:'Focused', suffix:'of Focus', stat:'mana', min:2, max:6 },
  { prefix:'Swift', suffix:'of Swiftness', stat:'speed', min:0.1, max:0.3 },
  { prefix:'Vampiric', suffix:'of Leeching', stat:'lifesteal', min:5, max:15 },
  { prefix:'Frostbitten', suffix:'of Frost', stat:'frostChance', min:10, max:25 },
  { prefix:'Echoing', suffix:'of Echoes', stat:'echoChance', min:10, max:25 },
  { prefix:'Shielding', suffix:'of Shielding', stat:'warding', min:5, max:20 },
  { prefix:'Igniting', suffix:'of Ignition', stat:'fireDamage', min:3, max:8 },
  { prefix:'Keen', suffix:'of Criticals', stat:'critChance', min:5, max:15 },
  { prefix:'Sapping', suffix:'of Draining', stat:'manaOnHit', min:2, max:6 },
  { prefix:'Barbed', suffix:'of Thorns', stat:'thorns', min:5, max:15 },
  { prefix:'Learning', suffix:'of Enlightenment', stat:'xpGain', min:5, max:15 },
  { prefix:'Shocking', suffix:'of Paralysis', stat:'paralyzeChance', min:10, max:25 }
];
const SLOT_NAMES = { weapon:'Blade', head:'Helm', chest:'Plate', gloves:'Gauntlets', pants:'Pantaloons', belt:'Girdle', boots:'Greaves', amulet:'Amulet', ring:'Band' };
const RARITY_COLORS = { common: '#888', uncommon: '#33cc33', rare: '#3366cc', epic: '#cc33cc' };
const RARITY_MULTS = { common: 1.0, uncommon: 1.4, rare: 1.9, epic: 2.5 };
const ITEM_TYPES = [
  { name:'Vitality Shard', stat:'health', baseValue:12, color:'#33cc33', slot:'chest' },
  { name:'Power Shard', stat:'damage', baseValue:6, color:'#cc3333', slot:'weapon' },
  { name:'Focus Shard', stat:'mana', baseValue:8, color:'#3366cc', slot:'head' },
  { name:'Swift Shard', stat:'speed', baseValue:0.2, color:'#cccc33', slot:'boots' },
  { name:'Iron Shard', stat:'health', baseValue:6, color:'#888888', slot:'gloves' },
  { name:'Stone Shard', stat:'health', baseValue:10, color:'#666666', slot:'belt' },
  { name:'Silk Shard', stat:'mana', baseValue:6, color:'#cc66cc', slot:'pants' },
  { name:'Star Shard', stat:'mana', baseValue:10, color:'#66cccc', slot:'amulet' },
  { name:'Fate Shard', stat:'damage', baseValue:4, color:'#cc6666', slot:'ring' }
];

let playerLifesteal = 0, playerFrostChance = 0, playerEchoChance = 0, playerWarding = 0;
let playerFireDamage = 0, playerCritChance = 0, playerManaOnHit = 0, playerThorns = 0;
let playerXpGain = 0, playerParalyzeChance = 0;
function recalcStats() {
  let bonusH = 0, bonusM = 0, bonusD = 0;
  let bonusSpeed = 0;
  let bonusShield = 0;
  playerLifesteal = 0; playerFrostChance = 0; playerEchoChance = 0; playerWarding = 0;
  playerFireDamage = 0; playerCritChance = 0; playerManaOnHit = 0; playerThorns = 0;
  playerXpGain = 0; playerParalyzeChance = 0;
  for (const item of Object.values(equipment)) {
    if (!item) continue;
    // base stat
    if (item.type.stat === 'health') bonusH += item.type.value;
    else if (item.type.stat === 'mana') bonusM += item.type.value;
    else if (item.type.stat === 'damage') bonusD += item.type.value;
    else if (item.type.stat === 'speed') bonusSpeed += item.type.value;
    // affix stats
    if (item.affixes) {
      for (const aff of item.affixes) {
        if (aff.stat === 'health') bonusH += aff.value;
        else if (aff.stat === 'mana') bonusM += aff.value;
        else if (aff.stat === 'damage') bonusD += aff.value;
        else if (aff.stat === 'speed') bonusSpeed += aff.value;
        else if (aff.stat === 'lifesteal') playerLifesteal += aff.value;
        else if (aff.stat === 'frostChance') playerFrostChance += aff.value;
        else if (aff.stat === 'echoChance') playerEchoChance += aff.value;
        else if (aff.stat === 'warding') { bonusShield += aff.value; playerWarding += aff.value; }
        else if (aff.stat === 'fireDamage') playerFireDamage += aff.value;
        else if (aff.stat === 'critChance') playerCritChance += aff.value;
        else if (aff.stat === 'manaOnHit') playerManaOnHit += aff.value;
        else if (aff.stat === 'thorns') playerThorns += aff.value;
        else if (aff.stat === 'xpGain') playerXpGain += aff.value;
        else if (aff.stat === 'paralyzeChance') playerParalyzeChance += aff.value;
      }
    }
  }
  playerMaxHealth = 100 + bonusH;
  playerMaxMana = 50 + bonusM;
  playerHealth = Math.min(playerHealth, playerMaxHealth);
  playerMana = Math.min(playerMana, playerMaxMana);
  attackDamage = BASE_ATTACK_DAMAGE + bonusD;
  maxShield = Math.floor(playerMaxHealth * 0.5);
  if (playerShield > maxShield) playerShield = maxShield;
  recalcStats._speedBonus = bonusSpeed;
}

function equipItem(invIndex) {
  const item = inventory[invIndex];
  if (!item) return;
  const slot = item.type.slot || 'accessory';
  // Unequip current item in that slot first
  if (equipment[slot]) {
    inventory.push(equipment[slot]);
  }
  equipment[slot] = item;
  inventory.splice(invIndex, 1);
  recalcStats();
  addCombatMessage(`Equipped ${item.type.name}.`);
}

function unequipItem(slot) {
  const item = equipment[slot];
  if (!item) return;
  inventory.push(item);
  equipment[slot] = null;
  recalcStats();
  addCombatMessage(`Unequipped ${item.type.name}.`);
}

function spawnItems() {
  items.length = 0;
  const count = 8;
  for (let i = 0; i < 200; i++) {
    const tx = 1 + Math.floor(Math.random() * (MAP_W - 2));
    const tz = 1 + Math.floor(Math.random() * (MAP_H - 2));
    if (!solid(tx, tz)) {
      const dist = Math.hypot(cam.x - (tx+0.5), cam.z - (tz+0.5));
      if (dist > 3) {
        const tmpl = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
        const rarityRoll = Math.random();
        let rarity, rarityMult;
        if (rarityRoll < 0.05) { rarity = 'epic'; rarityMult = RARITY_MULTS.epic; }
        else if (rarityRoll < 0.20) { rarity = 'rare'; rarityMult = RARITY_MULTS.rare; }
        else if (rarityRoll < 0.50) { rarity = 'uncommon'; rarityMult = RARITY_MULTS.uncommon; }
        else { rarity = 'common'; rarityMult = RARITY_MULTS.common; }
        const rawVal = tmpl.baseValue * rarityMult * (1 + (floorLevel - 1) * 0.1);
        const value = tmpl.stat === 'speed' ? Math.round(rawVal * 10) / 10 : Math.round(rawVal);
        const type = { ...tmpl, value, rarity };
        const affixes = [];
        const affixCount = Math.random() < 0.3 ? 2 : (Math.random() < 0.6 ? 1 : 0);
        let itemName = SLOT_NAMES[tmpl.slot] || tmpl.name;
        for (let a = 0; a < affixCount; a++) {
          const aff = AFFIXES[Math.floor(Math.random() * AFFIXES.length)];
          const affRaw = (aff.min + Math.random() * (aff.max - aff.min)) * rarityMult * (1 + (floorLevel - 1) * 0.05);
          const affValue = aff.stat === 'speed' ? Math.round(affRaw * 10) / 10 : Math.round(affRaw);
          affixes.push({ prefix: aff.prefix, suffix: aff.suffix, stat: aff.stat, value: affValue });
        }
        if (affixes.length > 0) {
          const prefAff = affixes[0];
          const suffAff = affixes.length > 1 ? affixes[1] : affixes[0];
          itemName = `${prefAff.prefix} ${SLOT_NAMES[tmpl.slot] || tmpl.name} ${suffAff.suffix}`;
        }
        items.push({ x: tx + 0.5, z: tz + 0.5, type, affixes, name: itemName, half: ITEM_HALF, bobPhase: Math.random() * Math.PI * 2 });
        if (items.length >= count) break;
      }
    }
  }
}
const CHASE_RANGE = 6.0;
const ENEMY_SPEED = 1.2;
const ENEMY_DAMAGE = 8;

function spawnEnemies() {
  enemies.length = 0;
  const count = 5;
  for (let i = 0; i < 200; i++) {
    const tx = 1 + Math.floor(Math.random() * (MAP_W - 2));
    const tz = 1 + Math.floor(Math.random() * (MAP_H - 2));
    if (!solid(tx, tz)) {
      const dist = Math.hypot(cam.x - (tx+0.5), cam.z - (tz+0.5));
      if (dist > 4) {
        enemies.push({ x: tx + 0.5, z: tz + 0.5, yaw: Math.random() * Math.PI * 2, speed: Math.random() * 1.5 + 0.8, bobPhase: Math.random() * Math.PI * 2, health: 40, maxHealth: 40, damageTimer: 0, burnTimer: 0, burnDamage: 0, paralyzedTimer: 0 });
        if (enemies.length >= count) break;
      }
    }
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.paralyzedTimer > 0) {
      e.paralyzedTimer -= dt;
      continue; // frozen, no movement or attack
    }
    const dx = cam.x - e.x, dz = cam.z - e.z;
    const dist = Math.hypot(dx, dz);
    if (dist < CHASE_RANGE && dist > 1.5) {
      const nx = dx / dist, nz = dz / dist;
      e.x += nx * ENEMY_SPEED * dt;
      e.z += nz * ENEMY_SPEED * dt;
      if (!solid(Math.floor(e.x), Math.floor(e.z))) continue;
      e.x -= nx * ENEMY_SPEED * dt;
      e.z -= nz * ENEMY_SPEED * dt;
    }
  }
  // Burn damage
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.burnTimer > 0) {
      e.burnTimer -= dt;
      e.health -= e.burnDamage * dt;
      if (e.health <= 0) {
        addCombatMessage('Crystal burns away!');
        enemies.splice(i, 1);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════
//  CAMERA
//  pos (x,y,z): world-space eye position. y=0.5 = mid-wall height.
//  yaw:   rotation around Y axis (left/right), radians.
//  pitch: rotation around X axis (up/down), radians, clamped ±76°.
//
//  Ray directions are precomputed for the full grid whenever yaw or
//  pitch changes. This amortises the per-cell trig cost: standing
//  still costs nothing; only turning rebuilds the table.
// ═══════════════════════════════════════════════════════════════════
const spawn = generateDungeon();
rebuildWallTiles();
const cam = { x:spawn.x, y:0.5, z:spawn.z, yaw:0, pitch:0 };
spawnEnemies();
spawnItems();
addCombatMessage('You have entered the Monospace.');

// Flat array of normalised world-space ray directions, stored as
// [rdx0,rdy0,rdz0, rdx1,rdy1,rdz1, ...] indexed by (cy*COLS+cx)*3.
const rayDirs = new Float64Array(COLS * ROWS * 3);
let lastYaw   = null; // null sentinel forces rebuild on first frame
let lastPitch = null;

// Horizontal FOV. Increasing this widens the view (fisheye at extremes).
const HFOV = Math.PI / 2.2; // ~82 degrees

// Focal length in cell units, derived from HFOV and grid width.
// Rays are constructed as: dir = normalize(ndcX * CELL_ASPECT, ndcY, FOCAL)
const FOCAL = (COLS / 2) / Math.tan(HFOV / 2);

// Aspect correction: cell width / cell height.
// Without this, the projection treats cells as square and the view
// looks vertically stretched. Multiply ndcX by CELL_ASPECT to fix.
const CELL_ASPECT = CW / CH;

// Rebuilds the full COLS×ROWS ray direction table from current cam yaw/pitch.
// Called once at startup and on any camera rotation.
function rebuildRayDirs() {
  const tmp1 = new Float64Array(3);
  const tmp2 = new Float64Array(3);
  for(let cy=0; cy<ROWS; cy++) {
    for(let cx=0; cx<COLS; cx++) {
      // Cell centre in NDC: x in [-COLS/2, COLS/2], y in [-ROWS/2, ROWS/2]
      const ndcX = (cx + 0.5) - COLS/2;
      const ndcY = (cy + 0.5) - ROWS/2;

      // Camera-space direction. Y is negated so screen-down = world-down.
      // CELL_ASPECT on X ensures equal angular step per cell horizontally & vertically.
      const rx = ndcX * CELL_ASPECT;
      const ry = -ndcY;
      const rz = FOCAL;
      const il = 1 / Math.sqrt(rx*rx + ry*ry + rz*rz);

      // Rotate camera-space dir into world space: pitch (X) then yaw (Y).
      rotX3(rx*il, ry*il, rz*il, cam.pitch, tmp1);
      rotY3(tmp1[0], tmp1[1], tmp1[2], cam.yaw, tmp2);

      const i = (cy * COLS + cx) * 3;
      rayDirs[i]   = tmp2[0];
      rayDirs[i+1] = tmp2[1];
      rayDirs[i+2] = tmp2[2];
    }
  }
  lastYaw   = cam.yaw;
  lastPitch = cam.pitch;
}

// ═══════════════════════════════════════════════════════════════════
//  LIGHTING
//  Single directional light (sun). Normalised world-space direction.
//  Shading = ambient + max(0, dot(normal, SUN)) * diffuseScale.
//  Fog = max(0, 1 - t/FOG_DIST) — multiplied into brightness.
// ═══════════════════════════════════════════════════════════════════
const _sunLen = Math.sqrt(0.4*0.4 + 1*1 + 0.6*0.6);
const SUN = [0.4/_sunLen, 1/_sunLen, 0.6/_sunLen];
const FOG_DIST = 14; // world units at which surfaces fade to black

// ═══════════════════════════════════════════════════════════════════
//  PICKUP CUBE
//  A small spinning AABB "item pickup" sitting on the floor.
//  Spins around its Y axis; bobs sinusoidally up and down.
//
//  The cube is defined in its own object space (centred at origin,
//  half-extent PHALF). To intersect it, the ray is transformed into
//  object space by translating to the cube centre and applying the
//  inverse spin rotation. The hit normal is rotated back to world
//  space for lighting.
//
//  To add more pickups / entities: duplicate this pattern with
//  different world positions and spin phases.
// ═══════════════════════════════════════════════════════════════════
const PHALF = 0.18;    // half-extent of cube (so cube is 0.36 units wide)

// ═══════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════
function render(t) {
  if (playerDead) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = `${CH * 3}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('YOU DIED', canvas.width / 2, canvas.height / 2 - CH);
    ctx.font = `${CH * 1.5}px monospace`;
    ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + CH * 2);
    ctx.textAlign = 'left';
    return;
  }

  // ── Pickup animation ──────────────────────────────────────────
  const pickYaw = t * 1.1;                    // spin speed (rad/s)
  const bob     = Math.sin(t * 2.1) * 0.04;  // vertical bob amplitude
  // Cube Y bounds in world space (bob shifts both floor and top)
  const pickBobY = bob; // bottom of cube

  // ── Precomputed ray dirs (rebuild if camera rotated) ──────────
  if(lastYaw===null || cam.yaw!==lastYaw || cam.pitch!==lastPitch)
    rebuildRayDirs();

  // ── Clear canvas ──────────────────────────────────────────────
  ctx.fillStyle = '#06000f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Set font once per frame — not per cell — for performance.
  ctx.font = `${CH}px 'Courier New',monospace`;

  const camx=cam.x, camy=cam.y, camz=cam.z;

  // ── Per-cell ray loop ─────────────────────────────────────────
  for(let cy=0; cy<ROWS; cy++) {
    for(let cx=0; cx<COLS; cx++) {
      const ri  = (cy*COLS + cx) * 3;
      const rdx = rayDirs[ri], rdy = rayDirs[ri+1], rdz = rayDirs[ri+2];

      let bestT     = 1e38; // distance to nearest hit so far
      let bestCh    = ' ';  // character to draw
      let bestColor = '';

      // ── TEST: Walls ─────────────────────────────────────────
      // Each solid tile is a unit AABB [tx,0,tz]→[tx+1,1,tz+1].
      // wallTiles[] is precomputed at startup; no tile bounds math here.
      for(const w of wallTiles) {
        const t = rayAABB(camx,camy,camz, rdx,rdy,rdz,
                          w[0],w[1],w[2], w[3],w[4],w[5], nOut);
        if(t<0 || t>=bestT) continue;
        const diffuse = Math.max(0, dot3(nOut[0],nOut[1],nOut[2], SUN[0],SUN[1],SUN[2]));
        const fog     = Math.max(0, 1 - t/FOG_DIST);
        const b       = (0.1 + diffuse*0.9) * fog;
        bestT         = t;
        bestCh        = ramp(b);
        bestColor     = `hsl(28,25%,${Math.floor(8+b*42)}%)`;
      }

      // ── TEST: Floor (Y = 0 plane) ────────────────────────────
      // t = (targetY - rayOriginY) / rayDirY
      // Skip if ray is horizontal (rdy ≈ 0) to avoid divide-by-zero.
      if(Math.abs(rdy) > 1e-8) {
        const t = (0 - camy) / rdy;
        if(t > 1e-4 && t < bestT) {
          // Check that the hit point is inside an open (non-solid) tile
          const hx=camx+rdx*t, hz=camz+rdz*t;
          if(!solid(Math.floor(hx), Math.floor(hz))) {
            const fog = Math.max(0, 1 - t/FOG_DIST);
            const b   = 0.05 + fog*0.30;
            bestT     = t;
            bestCh    = ramp(b);
            bestColor = `hsl(220,12%,${Math.floor(3+fog*16)}%)`;
          }
        }

        // ── TEST: Ceiling (Y = 1 plane) ──────────────────────
        const tc = (1 - camy) / rdy;
        if(tc > 1e-4 && tc < bestT) {
          const hx=camx+rdx*tc, hz=camz+rdz*tc;
          if(!solid(Math.floor(hx), Math.floor(hz))) {
            const fog = Math.max(0, 1 - tc/FOG_DIST);
            const b   = 0.04 + fog*0.22;
            bestT     = tc;
            bestCh    = ramp(b);
            bestColor = `hsl(220,8%,${Math.floor(2+fog*10)}%)`;
          }
        }
      }

      // ── Items ─────────────────────────────────────────────
      for (const it of items) {
        const bob = 0.03 + Math.sin(t * 3.0 + it.bobPhase) * 0.01;
        const ox = camx - it.x;
        const oy = camy - (0.05 + bob);
        const oz = camz - it.z;
        const tHit = rayAABB(ox, oy, oz, rdx, rdy, rdz, -it.half, 0, -it.half, it.half, it.half * 2, it.half, nOut);
        if (tHit >= 0 && tHit < bestT) {
          const diffuse = Math.max(0, dot3(nOut[0], nOut[1], nOut[2], SUN[0], SUN[1], SUN[2]));
          const fog = Math.max(0, 1 - tHit / FOG_DIST);
          const b = (0.3 + diffuse * 0.7) * fog;
          bestT = tHit;
          bestCh = ramp(b);
          // Parse hex colour from item type
          const hex = it.type.color;
          const r = parseInt(hex.slice(1,3), 16);
          const g = parseInt(hex.slice(3,5), 16);
          const br = parseInt(hex.slice(5,7), 16);
          const rr = Math.floor(r * b + 8 * (1 - b));
          const gg = Math.floor(g * b + 8 * (1 - b));
          const bb = Math.floor(br * b + 8 * (1 - b));
          bestColor = `rgb(${rr},${gg},${bb})`;
        }
      }

      // ── TEST: Enemies ──────────────────────────────────────
      for (const e of enemies) {
        const ox = camx - e.x;
        const oy = camy - (0.45 + Math.sin(t + e.bobPhase) * 0.08);
        const oz = camz - e.z;
        // Tumble in both axes: Y rotation (e.yaw) and X rotation (time * speed)
        const yawInv = -e.yaw;
        const pitchInv = -(t + e.bobPhase) * e.speed;
        const cY = Math.cos(yawInv), sY = Math.sin(yawInv);
        const cP = Math.cos(pitchInv), sP = Math.sin(pitchInv);
        // Rotate around Y
        let rx = ox * cY + oz * sY;
        let ry = oy;
        let rz = -ox * sY + oz * cY;
        // Rotate around X
        const ry2 = ry * cP - rz * sP;
        const rz2 = ry * sP + rz * cP;
        // Rotate ray direction same way
        let rdxR = rdx * cY + rdz * sY;
        let rdyR = rdy;
        let rdzR = -rdx * sY + rdz * cY;
        const rdy2 = rdyR * cP - rdzR * sP;
        const rdz2 = rdyR * sP + rdzR * cP;
        const eh = ENEMY_RADIUS;
        const tHit = rayAABB(rx, ry2, rz2, rdxR, rdy2, rdz2, -eh, -eh, -eh, eh, eh, eh, nOut);
        if (tHit >= 0 && tHit < bestT) {
          const diffuse = Math.max(0, dot3(nOut[0], nOut[1], nOut[2], SUN[0], SUN[1], SUN[2]));
          const fog = Math.max(0, 1 - tHit / FOG_DIST);
          const b = (0.25 + diffuse * 0.75) * fog;
          bestT = tHit;
          bestCh = ramp(b);
          bestColor = `hsl(160, ${Math.floor(45 + b * 35)}%, ${Math.floor(18 + b * 58)}%)`;
        }
      }

      // ── Draw cell ────────────────────────────────────────────
      if(bestCh !== ' ') {
        ctx.fillStyle = bestColor;
        ctx.fillText(bestCh, cx*CW, cy*CH);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════
//  INPUT
//  keys{} tracks held keys by e.code (layout-independent).
//  Arrow keys have default scroll behaviour suppressed.
//
//  Pointer lock: the click listener lives on #overlay (not canvas)
//  because the overlay is position:absolute and intercepts clicks.
//  Once locked, overlay is hidden and mousemove drives cam.yaw/pitch.
// ═══════════════════════════════════════════════════════════════════
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && playerDead) { resetGame(); return; }
  if (e.code === 'Tab') {
    e.preventDefault();
    const newState = !inventoryOpen;
    inventoryOpen = newState;
    if (setInvOpen) setInvOpen(newState);
    if (newState) {
      canvas.style.cursor = 'default';
      if (document.pointerLockElement) document.exitPointerLock();
    } else {
      canvas.style.cursor = 'none';
      canvas.requestPointerLock();
    }
    return;
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))
    e.preventDefault(); // prevent page scroll and tab focus
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

let inventoryOpen = false;
let setInvOpen = null;
let locked = false;
let mouseDownThisFrame = false;
canvas.addEventListener('click', () => { if (!inventoryOpen) canvas.requestPointerLock(); });
canvas.addEventListener('mousedown', () => { if (!inventoryOpen) mouseDownThisFrame = true; });
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', e => {
  if(!locked) return;
  cam.yaw   += e.movementX * 0.0011;
  // movementY positive = mouse down = look down = pitch increases (more positive).
  // Pitch convention: positive pitch tilts camera upward (+Y direction).
  cam.pitch  = Math.max(-Math.PI*0.42, Math.min(Math.PI*0.42,
                 cam.pitch + e.movementY * 0.0011));
});

// ═══════════════════════════════════════════════════════════════════
//  MOVEMENT + COLLISION
//  Movement is always relative to yaw (never pitch) so the player
//  walks on the flat XZ plane regardless of where they're looking.
//
//  Collision is axis-separated: X and Z are tested independently.
//  This allows sliding along walls instead of stopping dead.
//  PRADIUS is the player collision radius in world units.
// ═══════════════════════════════════════════════════════════════════
const SPEED   = 4.0;  // world units per second
const PRADIUS = 0.3;  // player collision radius

function tryMove(dx, dz) {
  const nx = cam.x + dx;
  const nz = cam.z + dz;
  // Test X move: check both sides of player radius along current Z
  if(!solid(Math.floor(nx - PRADIUS), Math.floor(cam.z)) &&
     !solid(Math.floor(nx + PRADIUS), Math.floor(cam.z)))
    cam.x = nx;
  // Test Z move: check both sides of player radius along (possibly updated) X
  if(!solid(Math.floor(cam.x), Math.floor(nz - PRADIUS)) &&
     !solid(Math.floor(cam.x), Math.floor(nz + PRADIUS)))
    cam.z = nz;
}

// ═══════════════════════════════════════════════════════════════════
//  MAIN LOOP
//  dt is capped at 50ms (~20fps minimum) to prevent huge position
//  jumps if the tab is backgrounded and then foregrounded.
//  lastTime=null on first frame sets dt=0 (no movement on frame 1).
// ═══════════════════════════════════════════════════════════════════
let lastTime = null;

function frame(time) {
  const dt = lastTime===null ? 0 : Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  if(dt > 0 && !playerDead) {
    // ── Player attack cooldown ──
    playerAttackCooldown = Math.max(0, playerAttackCooldown - dt);
    // ── Player attack (raycast) ──
    if (mouseDownThisFrame && playerAttackCooldown <= 0) {
      const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
      const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
      const fdx = sy * cp, fdy = sp, fdz = cy * cp;
      let bestT = ATTACK_RANGE, bestE = null;
      for (const e of enemies) {
        const ox = cam.x - e.x, oz = cam.z - e.z;
        const cInv = Math.cos(-e.yaw), sInv = Math.sin(-e.yaw);
        let rx = ox * cInv + oz * sInv;
        let ry = cam.y - (0.45 + Math.sin(performance.now() * 0.001 + e.bobPhase) * 0.08);
        let rz = -ox * sInv + oz * cInv;
        let rdx = fdx * cInv + fdz * sInv;
        let rdy = fdy;
        let rdz = -fdx * sInv + fdz * cInv;
        const eh = ENEMY_RADIUS;
        const tHit = rayAABB(rx, ry, rz, rdx, rdy, rdz, -eh, -eh, -eh, eh, eh, eh, nOut);
        if (tHit >= 0 && tHit < bestT) { bestT = tHit; bestE = e; }
      }
      if (bestE) {
      // Determine damage (crit doubles it)
      let dmg = attackDamage;
      let crit = false;
      if (playerCritChance > 0 && Math.random() * 100 < playerCritChance) {
        dmg *= 2;
        crit = true;
      }
      bestE.health -= dmg;
      addCombatMessage(crit ? `You critically strike a crystal for ${dmg} damage!` : `You strike a crystal for ${dmg} damage.`);
      // Warding: gain shield on attack
      if (playerWarding > 0) {
        const maxShieldCap = Math.floor(playerMaxHealth * 0.5);
        playerShield = Math.min(playerShield + playerWarding, maxShieldCap);
      }
      // Lifesteal
      if (playerLifesteal > 0) {
        const heal = Math.round(dmg * playerLifesteal / 100);
        playerHealth = Math.min(playerMaxHealth, playerHealth + heal);
        if (heal > 0) addCombatMessage(`Lifesteal restores ${heal} HP.`);
      }
      // Frost
      if (playerFrostChance > 0 && Math.random() * 100 < playerFrostChance) {
        bestE.slowed = true;
        bestE.slowTimer = 1.5;
        addCombatMessage('Frost slows the crystal!');
      }
      // Echo
      if (playerEchoChance > 0 && Math.random() * 100 < playerEchoChance) {
        const echoDmg = Math.round(dmg * 0.6);
        bestE.health -= echoDmg;
        addCombatMessage(`Echo strikes for ${echoDmg} damage!`);
      }
      // Fire (always applies if any fire damage)
      if (playerFireDamage > 0) {
        bestE.burnTimer = 3.0;
        bestE.burnDamage = playerFireDamage;
        addCombatMessage(`Enemy set ablaze!`);
      }
      // Mana on hit
      if (playerManaOnHit > 0) {
        playerMana = Math.min(playerMaxMana, playerMana + playerManaOnHit);
      }
      // Paralyze
      if (playerParalyzeChance > 0 && Math.random() * 100 < playerParalyzeChance) {
        bestE.paralyzedTimer = 2.0;
        addCombatMessage('Crystal is paralyzed!');
      }
        if (bestE.health <= 0) {
          addCombatMessage('Crystal shatters!');
          enemies.splice(enemies.indexOf(bestE), 1);
        }
        playerAttackCooldown = ATTACK_COOLDOWN;
      }
      mouseDownThisFrame = false;
    }
    mouseDownThisFrame = false;

    // ── Enemy AI ──
    updateEnemies(dt);
    for (const e of enemies) {
      e.yaw += e.speed * dt;
      e.damageTimer -= dt;
      const dist = Math.hypot(cam.x - e.x, cam.z - e.z);
      if (e.paralyzedTimer <= 0 && dist < ENEMY_ATTACK_RANGE && e.damageTimer <= 0) {
        let dmg = ENEMY_DAMAGE;
        let absorbed = 0;
        if (playerShield > 0) {
          absorbed = Math.min(playerShield, dmg);
          playerShield -= absorbed;
          dmg -= absorbed;
        }
        playerHealth -= dmg;
        e.damageTimer = 1.0;
        addCombatMessage(`Enemy crystal strikes you! -${ENEMY_DAMAGE} damage${absorbed > 0 ? ` (shield absorbed ${absorbed})` : ''}`);
        updateHUD();
        // Thorns reflection
        if (playerThorns > 0) {
          const reflect = Math.round(ENEMY_DAMAGE * playerThorns / 100);
          e.health -= reflect;
          addCombatMessage(`Thorns reflect ${reflect} damage.`);
          if (e.health <= 0) {
            addCombatMessage('Crystal shatters from thorns!');
            enemies.splice(enemies.indexOf(e), 1);
          }
        }
        if (playerHealth <= 0) { playerHealth = 0; playerDead = true; addCombatMessage('You have been destroyed.'); updateHUD(); }
      }
    }

    // Forward/right vectors from yaw only (ignoring pitch for flat movement)
    const spd = SPEED + (recalcStats._speedBonus || 0);
    const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
    let dx=0, dz=0;
    if(keys['KeyW'] || keys['ArrowUp'])    { dx += sy*spd*dt; dz += cy*spd*dt; }
    if(keys['KeyS'] || keys['ArrowDown'])  { dx -= sy*spd*dt; dz -= cy*spd*dt; }
    if(keys['KeyA'] || keys['ArrowLeft'])  { dx -= cy*spd*dt; dz += sy*spd*dt; }
    if(keys['KeyD'] || keys['ArrowRight']) { dx += cy*spd*dt; dz -= sy*spd*dt; }
    if(dx || dz) tryMove(dx, dz);

    // ── Item pickup ──
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (Math.hypot(cam.x - it.x, cam.z - it.z) < PICKUP_RANGE) {
        inventory.push(it);
        items.splice(i, 1);
        addCombatMessage(`Picked up ${it.type.name}.`);
      }
    }
  }

  render(time * 0.001);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

const { useState, useEffect, useRef } = React;

const HudApp = () => {
  const [state, setState] = useState({ health:100, maxHealth:100, mana:50, maxMana:50, shield:0, maxShield:0, warding:0, log:combatLog, inventory:[...inventory], equipment:{...equipment}, attackDamage, lifesteal:0, frostChance:0, echoChance:0, fireDamage:0, critChance:0, manaOnHit:0, thorns:0, xpGain:0, paralyzeChance:0, playerSpeed:SPEED.toFixed(1) });
  const [destroyMode, setDestroyMode] = useState(false);
  const [showDestroyConfirm, setShowDestroyConfirm] = useState(false);
  const [activeTab, setActiveTab] = useState('inventory');
  const [invOpen, setInvOpenLocal] = useState(false);
  const [tooltip, setTooltip] = useState(null);
  const logRef = useRef(null);
  useEffect(() => { setPlayerState = setState; }, []);
  useEffect(() => { setInvOpen = setInvOpenLocal; }, [setInvOpenLocal]);
  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [state.log]);
  useEffect(() => { if (!invOpen) setTooltip(null); }, [invOpen]);

  const rowStyle = { display:'flex', alignItems:'center', gap:8, width:320, background:'rgba(0,0,0,0.6)', padding:'4px 10px', borderRadius:4 };
  const labelStyle = { width:40, textAlign:'right', fontSize:12, flexShrink:0 };
  const barBgStyle = { flex:1, height:14, background:'#222', border:'1px solid #444' };
  const valueStyle = { width:72, fontSize:10, color:'#aaa', flexShrink:0 };

  return (
    <>
      <div className="hud-bars">
        <div style={rowStyle}>
          <span style={labelStyle}>HP</span>
          <div style={{...barBgStyle, position:'relative', overflow:'hidden'}}><div style={{width:(state.health/state.maxHealth*100)+'%', height:'100%', background:'#cc3333'}} />{state.shield > 0 && <div style={{position:'absolute', top:'25%', right:0, width:Math.min((state.shield/state.maxHealth*100), 100)+'%', height:'50%', background:'#66ccff', borderRadius:1}} />}</div>
          <span style={valueStyle}>{state.health}/{state.maxHealth}</span>
        </div>
        <div style={rowStyle}>
          <span style={labelStyle}>MP</span>
          <div style={barBgStyle}><div style={{width:(state.mana/state.maxMana*100)+'%', height:'100%', background:'#3366cc'}} /></div>
          <span style={valueStyle}>{state.mana}/{state.maxMana}</span>
        </div>
      </div>
      {invOpen && (
        <>
                    {/* Wrapper for tabs + panel, positioned as one unit */}
          <div style={{position:'fixed', top:'45%', left:'50%', transform:'translate(-50%, -50%)', width:780, zIndex:20, pointerEvents:'auto'}}>
            {/* Tab row sits ABOVE the panel */}
            <div style={{display:'flex', alignItems:'flex-end', paddingLeft:8, position:'relative', zIndex:2}}>
              <button onClick={() => setActiveTab('inventory')} style={{
                background: '#111',
                border: '2px solid #555',
                borderBottom: activeTab==='inventory' ? '2px solid #111' : '2px solid #555',
                borderRadius: '4px 4px 0 0',
                padding: '4px 14px',
                cursor: 'pointer',
                fontSize: 13,
                color: '#ccc',
                position: 'relative',
                zIndex: activeTab==='inventory' ? 2 : 1,
                marginBottom: activeTab==='inventory' ? '-3px' : '-2px',
              }}>Inventory</button>
              <button onClick={() => setActiveTab('skilltree')} style={{
                background: '#111',
                border: '2px solid #555',
                borderBottom: activeTab==='skilltree' ? '2px solid #111' : '2px solid #555',
                borderRadius: '4px 4px 0 0',
                padding: '4px 14px',
                cursor: 'pointer',
                fontSize: 13,
                color: '#ccc',
                marginLeft: '-2px',
                position: 'relative',
                zIndex: activeTab==='skilltree' ? 2 : 1,
                marginBottom: activeTab==='skilltree' ? '-3px' : '-2px',
              }}>Skill Tree</button>
            </div>
            {/* Panel — top border sits flush under the tabs */}
            <div style={{background:'#111', border:`2px solid ${destroyMode ? '#cc3333' : '#555'}`, borderRadius:'6px 6px 6px 6px', padding:0, position:'relative', zIndex:1}} onClick={e => e.stopPropagation()}>
              <div style={{padding:16}}>
            {activeTab === 'inventory' ? (
              <>
                <div style={{display:'flex', gap:12}}>
          {/* Stats column (left) */}
          <div style={{width:160, display:'flex', flexDirection:'column', gap:6, borderRight:'1px solid #333', paddingRight:12, flexShrink:0}}>
            <div style={{color:'#ccc', fontSize:13, marginBottom:4}}>Stats</div>
            <div style={{color:'#aaa', fontSize:11}}>HP: {state.maxHealth}</div>
            <div style={{color:'#aaa', fontSize:11}}>MP: {state.maxMana}</div>
            <div style={{color:'#aaa', fontSize:11}}>Shield: {state.shield || 0}/{state.maxShield || 0}</div>
            <div style={{color:'#aaa', fontSize:11}}>ATK: {state.attackDamage}</div>
            <div style={{color:'#aaa', fontSize:11}}>SPD: {state.playerSpeed}</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.lifesteal||0) > 0 ? 1 : 0.4}}>Lifesteal: {state.lifesteal || 0}%</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.frostChance||0) > 0 ? 1 : 0.4}}>Frost: {state.frostChance || 0}%</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.echoChance||0) > 0 ? 1 : 0.4}}>Echo: {state.echoChance || 0}%</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.fireDamage||0) > 0 ? 1 : 0.4}}>Fire: {state.fireDamage || 0} dmg/s</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.critChance||0) > 0 ? 1 : 0.4}}>Crit: {state.critChance || 0}%</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.manaOnHit||0) > 0 ? 1 : 0.4}}>Mana/hit: {state.manaOnHit || 0}</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.thorns||0) > 0 ? 1 : 0.4}}>Thorns: {state.thorns || 0}%</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.paralyzeChance||0) > 0 ? 1 : 0.4}}>Paralyze: {state.paralyzeChance || 0}%</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.xpGain||0) > 0 ? 1 : 0.4}}>XP Gain: {state.xpGain || 0}%</div>
            <div style={{color:'#aaa', fontSize:11, opacity: (state.warding||0) > 0 ? 1 : 0.4}}>Warding: {state.warding || 0}</div>

          </div>
          {/* Inventory grid 8×4 (center) */}
          <div style={{flex:1}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                  <div style={{color:'#ccc', fontSize:14}}>Inventory [{inventory.length}/40] — press Tab to close</div>
                  <div style={{display:'flex', gap:6}}>
                    <button onClick={() => setDestroyMode(!destroyMode)} style={{background:destroyMode?'#cc3333':'#333', border:'1px solid #555', color:'#ccc', borderRadius:3, padding:'2px 8px', cursor:'pointer', fontSize:11}}>
                      {destroyMode ? 'Destroy: ON' : 'Destroy: OFF'}
                    </button>
                    <button onClick={() => setShowDestroyConfirm(true)} style={{background:'#333', border:'1px solid #555', color:'#ccc', borderRadius:3, padding:'2px 8px', cursor:'pointer', fontSize:11}}>Destroy All</button>
                  </div>
                </div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(10, 56px)', gap:2, justifyContent:'start'}}>
              {Array.from({length:40}, (_, i) => {
                const item = inventory[i];
                return (
                  <div key={i} onClick={() => { if (item) { if (destroyMode) { inventory.splice(i,1); recalcStats(); addCombatMessage(`Destroyed ${item.name || item.type.name}.`); setState({...state, inventory:[...inventory]}); } else { equipItem(i); } }}}
                    onMouseEnter={e => { if (item) setTooltip({ item, x: e.clientX, y: e.clientY }); }}
                    onMouseMove={e => { if (item) setTooltip({ item, x: e.clientX, y: e.clientY }); }}
                    onMouseLeave={() => setTooltip(null)}
                    style={{width:56, height:56, background:'#111', border:`2px solid ${item?.type?.rarity ? RARITY_COLORS[item.type.rarity] : '#333'}`, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', cursor:item?'pointer':'default', fontSize:11, color:item?item.type.color:'#444'}}>
                    {item ? <><div style={{fontSize:11}}>{item.name ? item.name.charAt(0) : item.type.name.charAt(0)}</div>{item.affixes && item.affixes.length > 0 && <div style={{fontSize:8, color:'#ccaa44'}}>+{item.affixes.length}</div>}</> : ''}
                  </div>
                );
              })}
            </div>
            {/* Equipped items row below inventory */}
            <div style={{marginTop:12, display:'flex', justifyContent:'space-between', flexWrap:'wrap'}}>
              {['weapon','head','chest','gloves','pants','belt','boots','amulet','ring'].map(slot => {
                const item = equipment[slot];
                return (
                  <div key={slot} onClick={() => { if (item) { if (destroyMode) { equipment[slot] = null; recalcStats(); addCombatMessage(`Destroyed ${item.name || item.type.name}.`); setState({...state, equipment:{...equipment}}); } else { unequipItem(slot); } }}}
                    onMouseEnter={e => { if (item) setTooltip({ item, x: e.clientX, y: e.clientY }); }}
                    onMouseMove={e => { if (item) setTooltip({ item, x: e.clientX, y: e.clientY }); }}
                    onMouseLeave={() => setTooltip(null)}
                    style={{display:'flex', flexDirection:'column', alignItems:'center', gap:3}}>
                    <div style={{width:50, height:50, background:'#111', border:`2px solid ${item?.type?.rarity ? RARITY_COLORS[item.type.rarity] : '#333'}`, borderRadius:3, display:'flex', alignItems:'center', justifyContent:'center', cursor:item?'pointer':'default', fontSize:13, color:item?item.type.color:'#444'}}>
                      {item ? <><div style={{fontSize:13}}>{item.name ? item.name.charAt(0) : item.type.name.charAt(0)}</div>{item.affixes && item.affixes.length > 0 && <div style={{fontSize:9, color:'#ccaa44'}}>+{item.affixes.length}</div>}</> : ''}
                    </div>
                    <div style={{color:'#888', fontSize:9, textAlign:'center'}}>{slot.toUpperCase()}</div>
                  </div>
                );
              })}
            </div>
          </div>
            </div>
              </>
            ) : (
              <div style={{height:400, display:'flex', alignItems:'center', justifyContent:'center', color:'#555', fontSize:14}}>
                Skill Tree — coming soon
              </div>
            )}
              </div>
            </div>
          </div>
        </>
      )}
      <div className="combat-log" ref={logRef}>
        {state.log.map((msg,i) => <div key={i}>{msg}</div>)}
      </div>
      {showDestroyConfirm && (
        <div style={{position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:40, pointerEvents:'auto'}} onClick={() => setShowDestroyConfirm(false)}>
          <div style={{background:'#1a1a1a', border:'1px solid #555', borderRadius:6, padding:20, width:320, textAlign:'center'}} onClick={e => e.stopPropagation()}>
            <div style={{color:'#ccc', fontSize:14, marginBottom:16}}>Destroy all inventory items?</div>
            <div style={{display:'flex', justifyContent:'center', gap:12}}>
              <button onClick={() => { inventory.length = 0; recalcStats(); addCombatMessage('All inventory items destroyed.'); setState({...state, inventory:[]}); setShowDestroyConfirm(false); }} style={{background:'#cc3333', border:'none', color:'#fff', borderRadius:3, padding:'6px 18px', cursor:'pointer', fontSize:13}}>Yes</button>
              <button onClick={() => setShowDestroyConfirm(false)} style={{background:'#333', border:'1px solid #555', color:'#ccc', borderRadius:3, padding:'6px 18px', cursor:'pointer', fontSize:13}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
      {tooltip && (
        <div style={{position:'fixed', left:tooltip.x+12, top:tooltip.y-10, background:'rgba(0,0,0,0.9)', border:'1px solid #555', borderRadius:4, padding:8, zIndex:30, pointerEvents:'none', minWidth:150}}>
          <div style={{color:tooltip.item.type.rarity ? RARITY_COLORS[tooltip.item.type.rarity] : '#ccc', fontSize:12, marginBottom:4}}>{tooltip.item.name || tooltip.item.type.name}</div>
          <div style={{color:'#888', fontSize:10, marginBottom:4}}>{tooltip.item.type.slot ? tooltip.item.type.slot.toUpperCase() : 'ITEM'}</div>
          <div style={{color:'#fff', fontSize:11}}>+{tooltip.item.type.value} {tooltip.item.type.stat.toUpperCase()}</div>
          {tooltip.item.affixes && tooltip.item.affixes.map((aff,i) => (
            <div key={i} style={{color:'#ccaa44', fontSize:11}}>+{aff.value} {aff.stat.toUpperCase()}</div>
          ))}
          <div style={{color:tooltip.item.type.rarity ? RARITY_COLORS[tooltip.item.type.rarity] : '#888', fontSize:10, marginTop:4}}>{tooltip.item.type.rarity ? tooltip.item.type.rarity.toUpperCase() : 'COMMON'}</div>
        </div>
      )}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('hud-root')).render(<HudApp />);
</script>
</body>
</html>
